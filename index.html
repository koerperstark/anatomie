<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#162225">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Anatomie</title>
<meta name="apple-mobile-web-app-title" content="Anatomie">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F2F5F5; --surface:#FFFFFF; --surface2:#E7EEEF; --raise:#FAFCFC;
  --ink:#13262A; --ink2:#4B6268; --ink3:#7C9197;
  --line:#D2DDDE; --line2:#BECDCF;
  --acc:#0F4C5C; --accInk:#FFFFFF; --accSoft:#E0EDEF;
  --rust:#A34B33; --rustSoft:#F7EBE6;
  --good:#2C6B52; --goodSoft:#E1F0E8;
  --again:#96551C; --againSoft:#F8EDE0;
  --shadow:0 1px 2px rgba(19,38,42,.06),0 8px 24px rgba(19,38,42,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1618; --surface:#162225; --surface2:#1F2E32; --raise:#1B282C;
  --ink:#E4EDEE; --ink2:#9FB3B7; --ink3:#788D92;
  --line:#293A3E; --line2:#35494E;
  --acc:#64B8C8; --accInk:#06161A; --accSoft:#17323A;
  --rust:#DE8C6D; --rustSoft:#33221C;
  --good:#6BC79C; --goodSoft:#142C22;
  --again:#E0A85C; --againSoft:#31240F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0D1618; --surface:#162225; --surface2:#1F2E32; --raise:#1B282C;
  --ink:#E4EDEE; --ink2:#9FB3B7; --ink3:#788D92;
  --line:#293A3E; --line2:#35494E;
  --acc:#64B8C8; --accInk:#06161A; --accSoft:#17323A;
  --rust:#DE8C6D; --rustSoft:#33221C;
  --good:#6BC79C; --goodSoft:#142C22;
  --again:#E0A85C; --againSoft:#31240F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100svh;
  max-width:760px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6}

header{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px 0}
.brandrow{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.brand{font-family:"Zilla Slab",Georgia,serif;font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand{color:var(--acc)}
.count{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--ink3);
  font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
nav{display:flex;gap:2px;margin-top:10px}
nav button{flex:1;appearance:none;border:0;background:transparent;cursor:pointer;font:inherit;
  font-weight:600;font-size:14px;color:var(--ink2);padding:9px 2px 10px;
  border-bottom:2px solid transparent;border-radius:6px 6px 0 0}
nav button[aria-selected="true"]{color:var(--acc);border-bottom-color:var(--acc)}
nav button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}

.subbar{background:var(--surface2);border-bottom:1px solid var(--line)}
.subbar:empty{display:none}
.seg{display:flex;gap:4px;padding:9px 16px 0}
.seg button{flex:1;appearance:none;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600;
  padding:7px 6px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.seg button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:9px 16px;scrollbar-width:none}
.chips.inline{padding:0 0 2px;margin:-2px 0 -4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;appearance:none;cursor:pointer;font:inherit;font-size:13px;font-weight:600;
  padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);
  color:var(--ink2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.chip:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chip .n{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;opacity:.7;margin-left:5px}

main{flex:1 1 auto;padding:14px 16px 8px}
.pane{display:flex;flex-direction:column;gap:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);overflow:hidden}
.card.front{border-left:4px solid var(--acc)}
.cardhead{padding:18px 18px 14px}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;font-weight:500;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.lat{font-family:"Zilla Slab",Georgia,serif;font-weight:600;font-size:26px;line-height:1.18;
  margin:6px 0 2px;text-wrap:balance;color:var(--ink)}
.lat.sm{font-size:21px}
.de{font-size:17px;color:var(--ink2);font-style:italic}
.lead{margin:12px 0 0;color:var(--ink2);font-size:15px}
.hint{margin:14px 0 0;color:var(--ink3);font-size:13px}

.facts{border-top:1px solid var(--line)}
.fact{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:10px 18px;
  border-bottom:1px solid var(--line);font-size:14.5px}
.fact:last-child{border-bottom:0}
.fact dt{color:var(--ink3);font-size:12px;font-weight:600;letter-spacing:.03em;
  text-transform:uppercase;padding-top:2px}
.fact dd{margin:0;color:var(--ink)}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

.uaf{border-top:1px solid var(--line);padding:14px 18px}
.uaf h4{margin:0 0 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--acc);font-weight:700}
.part{border-left:3px solid var(--line2);padding:2px 0 2px 12px;margin-bottom:14px}
.part:last-child{margin-bottom:0}
.part .pname{font-family:"Zilla Slab",Georgia,serif;font-weight:600;font-size:15px;margin-bottom:4px}
.part .row{display:grid;grid-template-columns:60px 1fr;gap:8px;font-size:14px;margin-bottom:3px}
.part .row b{color:var(--ink3);font-weight:600;font-size:12px;text-transform:uppercase;
  letter-spacing:.03em;padding-top:3px}

.box{margin:0;padding:14px 18px;font-size:14.5px;border-top:1px solid var(--line)}
.box.sum{background:var(--accSoft)}
.box.merk{background:var(--rustSoft)}
.box h4{margin:0 0 5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.box.sum h4{color:var(--acc)}
.box.merk h4{color:var(--rust)}

.bar{position:sticky;bottom:0;z-index:6;margin-top:auto;display:flex;gap:10px;padding:10px 16px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--surface);border-top:1px solid var(--line)}
.bar:empty{display:none}
.btn{flex:1;appearance:none;cursor:pointer;font:inherit;font-weight:700;font-size:15px;
  min-height:48px;border-radius:11px;border:1px solid var(--line2);background:var(--surface2);
  color:var(--ink);display:flex;align-items:center;justify-content:center;gap:7px;padding:0 12px}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.btn.good{background:var(--goodSoft);border-color:var(--good);color:var(--good)}
.btn.again{background:var(--againSoft);border-color:var(--again);color:var(--again)}
.btn.ghost{background:transparent}
.btn small{display:block;font-weight:500;font-size:11px;opacity:.75}
.btn .stack{display:flex;flex-direction:column;align-items:center;line-height:1.2}

.qhead{padding:16px 18px 4px}
.qtype{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink3)}
.qtext{font-family:"Zilla Slab",Georgia,serif;font-size:20px;font-weight:600;line-height:1.32;
  margin:8px 0 16px;text-wrap:balance}
.qtext em{font-style:normal;color:var(--acc)}
.opts{display:flex;flex-direction:column;gap:8px;padding:0 18px 18px}
.opt{appearance:none;cursor:pointer;font:inherit;font-size:15px;text-align:left;min-height:48px;
  padding:11px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--raise);
  color:var(--ink);display:flex;align-items:center;gap:10px}
.opt .k{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--ink3);
  flex:0 0 auto;width:16px}
.opt:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.opt[data-state="right"]{background:var(--goodSoft);border-color:var(--good);color:var(--good);font-weight:600}
.opt[data-state="wrong"]{background:var(--againSoft);border-color:var(--again);color:var(--again)}
.opt[data-state="pick"]{background:var(--accSoft);border-color:var(--acc)}
.opt[disabled]{cursor:default}
.qfeed{padding:0 18px 16px;font-size:14.5px;color:var(--ink2)}
.qfeed b{color:var(--ink)}
.score{display:flex;gap:8px;align-items:center;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.prog{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden;margin-top:2px}
.prog i{display:block;height:100%;background:var(--acc)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center}
.tile .n{font-family:"Zilla Slab",Georgia,serif;font-size:24px;font-weight:700;color:var(--acc);
  font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-top:3px}
.reg{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.regrow{display:grid;grid-template-columns:1fr 52px;gap:10px;align-items:center;padding:10px 14px;
  border-bottom:1px solid var(--line);font-size:14.5px}
.regrow:last-child{border-bottom:0}
.meter{height:5px;border-radius:3px;background:var(--surface2);margin-top:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc);border-radius:3px}
.pct{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;color:var(--ink2);
  text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--ink3);padding:0 2px}
.empty{text-align:center;padding:40px 20px;color:var(--ink2)}
.empty .big{font-family:"Zilla Slab",Georgia,serif;font-size:20px;color:var(--ink);margin-bottom:6px}

.search{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:11px;
  border:1px solid var(--line2);background:var(--surface);color:var(--ink)}
.search:focus{outline:2px solid var(--acc);outline-offset:-1px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.li{display:block;width:100%;text-align:left;appearance:none;background:transparent;border:0;
  border-bottom:1px solid var(--line);font:inherit;cursor:pointer;padding:11px 14px;color:var(--ink)}
.li:last-child{border-bottom:0}
.li:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.li .t{font-weight:600;font-size:15px}
.li .s{font-size:13px;color:var(--ink3);margin-top:1px}
.lirow{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.lirow:last-child{border-bottom:0}
.lirow .li{flex:1 1 auto;min-width:0;border-bottom:0}
.seltog{flex:0 0 auto;width:50px;appearance:none;background:transparent;border:0;
  border-left:1px solid var(--line);color:var(--ink3);font-size:17px;cursor:pointer;
  font-family:"IBM Plex Mono",ui-monospace,monospace}
.seltog[aria-pressed="true"]{color:var(--acc);background:var(--accSoft)}
.seltog:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.bulk{display:flex;gap:8px;flex-wrap:wrap;margin:-2px 0 2px}
.bulkbtn{appearance:none;cursor:pointer;font:inherit;font-size:13px;font-weight:600;
  padding:7px 13px;border-radius:999px;border:1px solid var(--line2);
  background:var(--surface);color:var(--acc)}
.bulkbtn[disabled]{color:var(--ink3);cursor:default;background:var(--surface2)}
.bulkbtn.rm{color:var(--again)}
.bulkbtn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.starrow{padding:0 18px 14px;display:flex;gap:8px;flex-wrap:wrap}
.star{appearance:none;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600;
  padding:7px 13px;border-radius:999px;border:1px solid var(--line2);
  background:var(--raise);color:var(--ink2)}
.star[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.star:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.li .tag{float:right;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;
  letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);padding-top:3px}
h3.sec{font-family:"Zilla Slab",Georgia,serif;font-size:15px;font-weight:600;margin:4px 2px -4px;color:var(--ink2)}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3);padding:0 2px}
.crumb button{appearance:none;border:0;background:transparent;font:inherit;font-weight:600;
  color:var(--acc);cursor:pointer;padding:4px 0}
.mlist{display:flex;flex-wrap:wrap;gap:6px;padding:14px 18px;border-top:1px solid var(--line)}
.mchip{appearance:none;cursor:pointer;font:inherit;font-size:13.5px;padding:6px 11px;border-radius:999px;
  border:1px solid var(--line2);background:var(--raise);color:var(--ink)}
.mchip:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mchip small{color:var(--ink3);font-size:11.5px;margin-left:5px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.goal .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.goal .big{font-family:"Zilla Slab",Georgia,serif;font-size:18px;font-weight:600}
.goal .streak{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;color:var(--ink2)}
@media (prefers-reduced-motion:no-preference){
  .card,.opt{transition:background-color .15s ease,border-color .15s ease}
  main>.pane>.card:first-child{animation:in .2s ease both}
  @keyframes in{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:none}}
}
</style>

</head>
<body>
<div id="app">
  <div class="top">
  <header>
    <div class="brandrow">
      <div class="brand">Anatomie</div>
      <div class="count" id="count"></div>
    </div>
    <nav role="tablist">
      <button role="tab" id="t-karten" aria-selected="true">Karten</button>
      <button role="tab" id="t-quiz" aria-selected="false">Quiz</button>
      <button role="tab" id="t-wissen" aria-selected="false">Wissen</button>
      <button role="tab" id="t-stand" aria-selected="false">Stand</button>
    </nav>
  </header>
  <div class="subbar" id="subbar"></div>
  </div>
  <main id="main"></main>
  <div class="bar" id="bar"></div>
</div>

n die Rippe, unterstützen die Einatmung"],["Mm. levatores costarum longi","Querfortsätze der unteren Brustwirbel","Übernächste Rippe","Rippenhebung, zusätzlich Lateralflexion und Rotation zur Gegenseite"]],"sum":"Diese kleinen Muskeln heben die Rippen und verbinden die Bewegung der Wirbelsäule mit der Atmung.","merk":"Levatores costarum heißt schlicht Rippenheber. Sie sind das einzige Beispiel dafür, dass ein autochthoner Rückenmuskel auf die Atmung wirkt."},{"lat":"Mm. interspinales","de":"Zwischendornmuskeln","part":"Wirbelsäule und Rücken","lead":"Kurze Muskeln zwischen benachbarten Dornfortsätzen; longitudinales System des medialen Trakts.","kv":{"Regio":"Regio vertebralis, unmittelbar median zwischen den Dornfortsätzen","Gruppe und Schicht":"Autochthon, medialer Trakt, spinales oder interspinales System","Innervation":"Rr. dorsales der Spinalnerven","Segment (Rückenmarkshöhe)":"Segmental","Beteiligte Gelenke":"Jeweils ein Bewegungssegment","Gliederung":"Mm. interspinales cervicis und lumborum; thorakal meist nicht ausgebildet"},"rows":[["Einteilige Muskeln","Oberrand eines Dornfortsatzes","Unterrand des nächsthöheren Dornfortsatzes","Extension über ein Segment; hohe propriozeptive Dichte, damit Stellungsfühler"]],"sum":"Diese kleinen Muskeln verbinden benachbarte Dornfortsätze und melden, wie weit ein Segment gebeugt ist.","merk":"Inter heißt zwischen. Interspinales liegen zwischen den Dornfortsätzen, Intertransversarii zwischen den Querfortsätzen. Der Name nennt beide Enden zugleich."},{"lat":"M. semispinalis capitis","de":"halbdorniger Kopfmuskel","part":"Wirbelsäule und Rücken","lead":"Tiefer Nackenmuskel; hält und streckt den Kopf.","kv":{"Regio":"Regio cervicalis posterior (Nackenregion)","Gruppe und Schicht":"Autochthon, medialer Trakt, transversospinales System","Innervation":"Rr. dorsales der Spinalnerven","Segment (Rückenmarkshöhe)":"C1–C5","Beteiligte Gelenke":"Obere Kopfgelenke, HWS-Segmente","Gliederung":"Einteilig; die Fasern überspringen mehrere Segmente"},"rows":[["Gesamter Muskel","Querfortsätze C4–Th6","Os occipitale zwischen Linea nuchae superior und inferior","Extension der oberen HWS und des Kopfes, geringe Rotation zur Gegenseite"]],"sum":"Der Muskel hält den Kopf aufrecht und streckt ihn im Nacken.","merk":"Semispinalis bezeichnet den Verlauf zu den Dornfortsätzen über mehrere Segmente; der Kopfanteil endet am Hinterhauptbein."},{"lat":"M. multifidus","de":"vielgespaltener Muskel","part":"Wirbelsäule und Rücken","lead":"Tiefster Anteil des medialen Trakts; stabilisiert die Wirbelsäule segmental.","kv":{"Regio":"Regio vertebralis, am kräftigsten in der Regio lumbalis und sacralis","Gruppe und Schicht":"Autochthon, medialer Trakt, transversospinales System","Innervation":"Rr. dorsales der Spinalnerven, segmental","Segment (Rückenmarkshöhe)":"Alle Segmente","Beteiligte Gelenke":"Einzelne Wirbelsäulensegmente","Gliederung":"Einteilig aufgebaut, aber segmental gegliedert"},"rows":[["Lumbaler Abschnitt","Os sacrum, Processus mamillares der Lendenwirbel","Dornfortsätze zwei bis vier Segmente kranial","Segmentale Extension, Rotation zur Gegenseite, Stabilisation"],["Thorakaler und zervikaler Abschnitt","Querfortsätze der Brust- und Halswirbel","Dornfortsätze zwei bis vier Segmente kranial","Segmentale Extension und Rotation"]],"sum":"Der Muskel verbindet benachbarte Wirbel und stabilisiert die Wirbelsäule Segment für Segment.","merk":"Multifidus bedeutet vielfach gespalten. Er arbeitet vor der Bewegung, nicht in ihr."},{"lat":"Mm. rotatores breves et longi","de":"kurze und lange Drehmuskeln","part":"Wirbelsäule und Rücken","lead":"Kürzeste Muskeln des transversospinalen Systems; überwiegend Stellungsfühler, kaum Beweger.","kv":{"Regio":"Regio vertebralis, am deutlichsten im Brustabschnitt","Gruppe und Schicht":"Autochthon, medialer Trakt, transversospinales System","Innervation":"Rr. dorsales der Spinalnerven","Segment (Rückenmarkshöhe)":"Segmental, entsprechend der jeweiligen Höhe","Beteiligte Gelenke":"Jeweils ein bis zwei Wirbelbogengelenke","Gliederung":"Rotatores breves über null Segmente, Rotatores longi über ein Segment"},"rows":[["Mm. rotatores breves","Querfortsatz eines Wirbels","Wirbelbogen und Dornfortsatzwurzel des unmittelbar darüberliegenden Wirbels","Segmentale Rotation zur Gegenseite; vor allem propriozeptive Rückmeldung"],["Mm. rotatores longi","Querfortsatz eines Wirbels","Dornfortsatzwurzel des übernächsten Wirbels","Rotation über zwei Segmente, segmentale Sicherung"]],"sum":"Diese kürzesten Rückenmuskeln drehen einzelne Wirbel gegeneinander und melden dem Nervensystem deren Stellung.","merk":"Je kürzer der Muskel, desto näher an der Achse und desto mehr Wächter statt Motor. Semispinalis lang, Multifidus mittel, Rotatores kurz."},{"lat":"Mm. suboccipitales","de":"kurze Nackenmuskeln","part":"Wirbelsäule und Rücken","lead":"Vier kurze Muskeln zwischen Hinterhaupt, Atlas und Axis; die dichteste Muskelspindelversorgung des Körpers.","kv":{"Regio":"Regio cervicalis posterior, Trigonum suboccipitale (Nackenregion, tiefstes Dreieck)","Gruppe und Schicht":"Autochthon, tiefste Schicht (suboccipitale Muskulatur)","Innervation":"N. suboccipitalis, R. dorsalis von C1","Segment (Rückenmarkshöhe)":"C1","Beteiligte Gelenke":"Oberes und unteres Kopfgelenk","Gliederung":"Vier Muskeln: zwei gerade und zwei schräge"},"rows":[["M. rectus capitis posterior major","Processus spinosus axis","Linea nuchae inferior, mittleres Drittel","Extension des Kopfes, Rotation zur gleichen Seite"],["M. rectus capitis posterior minor","Tuberculum posterius atlantis","Linea nuchae inferior, mediales Drittel","Extension im oberen Kopfgelenk; über die myodurale Brücke Zug an der Dura mater"],["M. obliquus capitis superior","Processus transversus atlantis","Os occipitale oberhalb der Linea nuchae inferior","Extension und Lateralflexion im oberen Kopfgelenk"],["M. obliquus capitis inferior","Processus spinosus axis","Processus transversus atlantis","Rotation des Atlas gegen den Axis zur gleichen Seite; der Hauptdreher des unteren Kopfgelenks"]],"sum":"Diese vier kurzen Muskeln halten den Kopf in feinster Abstimmung über den beiden obersten Wirbeln und melden seine Stellung.","merk":"Die Namen beschreiben Lage und Richtung: rectus gerade, obliquus schräg, posterior hinten, major und minor nach der Größe, superior und inferior nach der Höhe. Vier Muskeln, vollständig aus dem Namen erschließbar."},{"lat":"M. pectoralis major","de":"großer Brustmuskel","part":"Thorax","lead":"Dreiteiliger Brustmuskel; Adduktor und Innenrotator des Arms.","kv":{"Regio":"Regio pectoralis und Regio infraclavicularis (Brustregion, Region unterhalb des Schlüsselbeins)","Gruppe und Schicht":"Thorakohumerale Gruppe der vorderen Brustwand","Innervation":"Nn. pectorales medialis et lateralis","Segment (Rückenmarkshöhe)":"C5–Th1","Beteiligte Gelenke":"Schultergelenk, indirekt Thorax","Gliederung":"Drei Anteile mit unterschiedlichem Ursprung, gemeinsamer Ansatz"},"rows":[["Pars clavicularis","Mediale Hälfte der Clavicula","Crista tuberculi majoris humeri","Flexion, Innenrotation, Adduktion"],["Pars sternocostalis","Sternum, Knorpel der Rippen 2–7","Crista tuberculi majoris humeri","Adduktion, Innenrotation; kräftigster Anteil"],["Pars abdominalis","Vorderes Blatt der Rektusscheide","Crista tuberculi majoris humeri","Zieht den elevierten Arm nach kaudal, Inspirationshilfe bei fixiertem Arm"]],"sum":"Der Muskel führt den Arm nach vorn und zur Körpermitte; seine drei Anteile ziehen ihn aus drei verschiedenen Winkeln.","merk":"Drei Anteile bedeuten drei Dehnwinkel am Türrahmen: tief, mittig, hoch."},{"lat":"M. pectoralis minor","de":"kleiner Brustmuskel","part":"Thorax","lead":"Tiefer Brustwandmuskel unter dem Pectoralis major; kippt das Schulterblatt nach ventral.","kv":{"Regio":"Regio pectoralis, tiefe Schicht, und Regio infraclavicularis","Gruppe und Schicht":"Thorakoskapuläre Gruppe der vorderen Brustwand","Innervation":"N. pectoralis medialis, teilweise auch lateralis","Segment (Rückenmarkshöhe)":"C6 bis Th1","Beteiligte Gelenke":"Skapulothorakale Gleitfläche, indirekt Sternoklavikular- und Akromioklavikulargelenk","Gliederung":"Drei Zacken mit gemeinsamer Endsehne"},"rows":[["Einteiliger Muskel mit drei Zacken","Dritte bis fünfte Rippe, ventral nahe dem Knorpel-Knochen-Übergang","Processus coracoideus scapulae","Zieht die Scapula nach ventral, kaudal und medial; kippt den unteren Schulterblattwinkel nach dorsal"],["Bei fixierter Scapula","Wie oben","Wie oben","Hebt die dritte bis fünfte Rippe; wirkt damit als Atemhilfsmuskel"]],"sum":"Der Muskel zieht das Schulterblatt nach vorn unten und hebt bei abgestützten Armen die Rippen.","merk":"Wo ein major ist, gibt es einen minor. Der große Brustmuskel bewegt den Arm, der kleine bewegt das Schulterblatt, denn er endet am Rabenschnabelfortsatz und nicht am Oberarm."},{"lat":"M. subclavius","de":"Unterschlüsselbeinmuskel","part":"Thorax","lead":"Kleiner Muskel zwischen erster Rippe und Schlüsselbein; sichert das Sternoklavikulargelenk.","kv":{"Regio":"Fossa infraclavicularis und Trigonum clavipectorale (Grube unterhalb des Schlüsselbeins)","Gruppe und Schicht":"Thorakoskapuläre Gruppe der vorderen Brustwand","Innervation":"N. subclavius aus dem Truncus superior des Plexus brachialis","Segment (Rückenmarkshöhe)":"C5 bis C6","Beteiligte Gelenke":"Sternoklavikulargelenk","Gliederung":"Einteilig"},"rows":[["Einteiliger Muskel","Erste Rippe am Übergang von Knochen zu Knorpel","Unterfläche der Clavicula im mittleren Drittel","Zieht die Clavicula nach kaudal und medial, hält den Gelenkkopf im Sternoklavikulargelenk und dämpft Stoßbelastungen"]],"sum":"Der Muskel hält das Schlüsselbein in seinem Gelenk am Brustbein und schützt die darunter liegenden Gefäße.","merk":"Sub heißt unter, clavius vom Schlüsselbein. Er ist der einzige Muskel, der unmittelbar unter der Clavicula liegt, und liefert damit die Erklärung für den Namen des Kostoklavikularsyndroms."},{"lat":"M. serratus anterior","de":"vorderer Sägemuskel","part":"Thorax","lead":"Führt das Schulterblatt am Brustkorb und rotiert es beim Armheben nach außen.","kv":{"Regio":"Regio axillaris und seitliche Regio pectoralis (Achselregion, seitliche Brustwand)","Gruppe und Schicht":"Thorakoskapuläre Gruppe der vorderen Brustwand","Innervation":"N. thoracicus longus","Segment (Rückenmarkshöhe)":"C5–C7","Beteiligte Gelenke":"Skapulothorakale Gleitfläche","Gliederung":"Drei Anteile mit unterschiedlicher Zugrichtung"},"rows":[["Pars superior","Rippen 1 und 2","Angulus superior scapulae","Protraktion der Scapula"],["Pars intermedia","Rippen 2 bis 4","Margo medialis scapulae","Protraktion, Andrücken der Scapula an den Thorax"],["Pars inferior","Rippen 4 bis 9","Angulus inferior scapulae","Außenrotation und Depression der Scapula; Voraussetzung für die Elevation über 120 Grad"]],"sum":"Der Muskel hält das Schulterblatt am Brustkorb und dreht es beim Armheben nach außen.","merk":"Serratus bedeutet Säge und beschreibt die Zackenreihe an den Rippen. Fällt er aus, steht das Schulterblatt beim Abstützen flügelartig ab."},{"lat":"Mm. intercostales","de":"Zwischenrippenmuskeln","part":"Thorax","lead":"Drei Schichten von Muskeln zwischen den Rippen; sie bewegen und versteifen die Brustwand bei der Atmung.","kv":{"Regio":"Spatia intercostalia der Regiones pectoralis und axillaris (Zwischenrippenräume)","Gruppe und Schicht":"Eigentliche Brustkorbmuskulatur, äußere bis innere Schicht","Innervation":"Nn. intercostales, Rr. ventrales der Spinalnerven Th1 bis Th11","Segment (Rückenmarkshöhe)":"Th1 bis Th11","Beteiligte Gelenke":"Kostovertebral-, Kostotransversal- und Sternokostalgelenke","Gliederung":"Drei Schichten: externi, interni und intimi"},"rows":[["Mm. intercostales externi","Unterrand einer Rippe, vom Tuberculum costae bis zum Knorpel-Knochen-Übergang","Oberrand der nächsttieferen Rippe","Heben die Rippen; wirken inspiratorisch und versteifen die Brustwand gegen Einziehung"],["Mm. intercostales interni","Oberrand einer Rippe, vom Sternum bis zum Rippenwinkel","Unterrand der nächsthöheren Rippe","Senken die Rippen; wirken exspiratorisch bei forcierter Ausatmung"],["Mm. intercostales intimi","Innenfläche einer Rippe","Innenfläche der nächsthöheren Rippe","Wirken wie die Interni; ergänzen die innerste Schicht der Brustwand"]],"sum":"Die Muskeln zwischen den Rippen heben und senken die Brustwand und halten die Zwischenrippenräume auf gleicher Weite.","merk":"Die äußeren ziehen wie die Hände in den Hosentaschen nach vorn unten und heben die Rippen; die inneren laufen gegenläufig und senken sie. Dieselbe Regel gilt eine Etage tiefer für die schrägen Bauchmuskeln."},{"lat":"M. transversus thoracis et Mm. subcostales","de":"innere Brustwandmuskeln","part":"Thorax","lead":"Innerste Schicht der Brustwand; unterstützt die Ausatmung und versteift die Rippenknorpel.","kv":{"Regio":"Innenfläche der Regio praesternalis und der Regio pectoralis","Gruppe und Schicht":"Eigentliche Brustkorbmuskulatur, innerste Schicht","Innervation":"Nn. intercostales","Segment (Rückenmarkshöhe)":"Th2 bis Th12","Beteiligte Gelenke":"Sternokostalgelenke, Kostovertebralgelenke","Gliederung":"Zwei getrennte Muskeln mit gleicher Schichtzugehörigkeit"},"rows":[["M. transversus thoracis","Innenfläche des Corpus sterni und des Processus xiphoideus","Zweiter bis sechster Rippenknorpel, Innenfläche","Senkt die Rippenknorpel; unterstützt die Ausatmung und spannt die vordere Brustwand"],["Mm. subcostales","Innenfläche der unteren Rippen nahe dem Rippenwinkel","Innenfläche der zweit- oder drittnächsten Rippe","Senken die Rippen; wirken exspiratorisch"]],"sum":"Diese innersten Brustwandmuskeln senken die Rippen bei der angestrengten Ausatmung und spannen die vordere Brustwand.","merk":"Transversus heißt quer, thoracis des Brustkorbs. Der Name benennt die Faserrichtung, und quer verlaufende Fasern ziehen die Rippen stets nach innen und unten, nie nach oben."},{"lat":"Diaphragma","de":"Zwerchfell","part":"Thorax","lead":"Wichtigster Atemmuskel des Körpers; trennt Brust- von Bauchraum und erzeugt etwa siebzig Prozent des Atemzugvolumens in Ruhe.","kv":{"Regio":"Grenze zwischen Cavitas thoracis und Cavitas abdominis; projiziert auf Regio praesternalis und Regiones hypochondriacae","Gruppe und Schicht":"Eigentliche Brustkorbmuskulatur; zugleich Teil des tiefen Stabilisationssystems","Innervation":"N. phrenicus aus dem Plexus cervicalis","Segment (Rückenmarkshöhe)":"C3 bis C5; daraus folgt die Schmerzausstrahlung in die Schulter","Beteiligte Gelenke":"Kostovertebral- und Sternokostalgelenke; funktionell die gesamte untere Thoraxapertur","Gliederung":"Pars sternalis, Pars costalis und Pars lumbalis mit Crus dextrum und sinistrum"},"rows":[["Pars sternalis","Hinterfläche des Processus xiphoideus","Centrum tendineum","Senkt die vordere Zwerchfellkuppel"],["Pars costalis","Innenfläche des siebten bis zwölften Rippenknorpels","Centrum tendineum","Senkt die seitliche Kuppel und hebt bei fixiertem Centrum die unteren Rippen nach außen"],["Pars lumbalis","Crus dextrum von den Wirbelkörpern L1 bis L3, Crus sinistrum von L1 bis L2, dazu Lig. arcuatum mediale über dem M. psoas major und laterale über dem M. quadratus lumborum","Centrum tendineum","Senkt den hinteren Anteil der Kuppel; erzeugt den größten Anteil der Volumenzunahme"],["Gesamtwirkung","Wie oben","Centrum tendineum","Vergrößert den Thoraxraum in allen drei Durchmessern und erzeugt den Unterdruck für die Einatmung; erhöht zugleich den intraabdominellen Druck"]],"sum":"Das Zwerchfell senkt sich bei jeder Einatmung, saugt damit Luft in die Lunge und stützt zugleich von innen den unteren Rücken.","merk":"Die drei Durchtrittsstellen liegen von ventral nach dorsal in absteigender Höhe: Vena cava bei Th8, Ösophagus bei Th10, Aorta bei Th12. Die überlieferte englische Merkhilfe zählt dazu die Buchstaben: vena cava acht, oesophagus zehn, aortic hiatus zwölf. Im Deutschen geht diese Zählung nicht auf; dort hilft nur die Reihenfolge acht, zehn, zwölf von vorn nach hinten."},{"lat":"M. rectus abdominis","de":"gerader Bauchmuskel","part":"Abdomen und Becken","lead":"Längs verlaufender Bauchmuskel in der Rektusscheide; beugt den Rumpf und richtet das Becken auf.","kv":{"Regio":"Regiones epigastrica, umbilicalis und pubica (Ober-, Nabel- und Schamregion)","Gruppe und Schicht":"Vordere Bauchwand, gerade Gruppe","Innervation":"Nn. intercostales Th5 bis Th12","Segment (Rückenmarkshöhe)":"Th5 bis Th12","Beteiligte Gelenke":"Sämtliche Segmente der Lendenwirbelsäule und der unteren Brustwirbelsäule, indirekt das Iliosakralgelenk","Gliederung":"Einteilig, jedoch durch drei bis vier Zwischensehnen segmentiert"},"rows":[["Kranialer Fixpunkt","Fünfter bis siebter Rippenknorpel, Processus xiphoideus","Os pubis zwischen Tuberculum pubicum und Symphyse","Bei fixiertem Becken Flexion des Rumpfes, Annäherung von Brustbein und Schambein"],["Kaudaler Fixpunkt","Wie oben","Wie oben","Bei fixiertem Brustkorb Aufrichtung des Beckens nach dorsal; Verringerung der Lendenlordose"],["Beidseitig gemeinsam mit den schrägen Bauchmuskeln","Wie oben","Wie oben","Bauchpresse; Erhöhung des intraabdominellen Drucks bei Husten, Niesen und Pressen"]],"sum":"Der Muskel läuft senkrecht über den Bauch, beugt den Rumpf nach vorn und richtet das Becken auf.","merk":"Rectus heißt gerade, abdominis des Bauches. Der Name nennt allein die Faserrichtung, und die senkrechte Richtung erlaubt nur eine Bewegung: das Zusammenführen von Brustbein und Schambein."},{"lat":"M. pyramidalis","de":"Pyramidenmuskel","part":"Abdomen und Becken","lead":"Kleiner dreieckiger Muskel vor dem unteren Rectusanteil; spannt die Linea alba.","kv":{"Regio":"Regio pubica (Schamregion)","Gruppe und Schicht":"Vordere Bauchwand, gerade Gruppe","Innervation":"N. subcostalis Th12","Segment (Rückenmarkshöhe)":"Th12","Beteiligte Gelenke":"Keine im eigentlichen Sinn","Gliederung":"Einteilig; inkonstant angelegt"},"rows":[["Einteiliger Muskel","Os pubis, ventral des Rectusansatzes, sowie Lig. pubicum superius","Linea alba, etwa auf halber Höhe zwischen Symphyse und Nabel","Spannt die Linea alba; unterstützt den unteren Anteil der Bauchpresse"]],"sum":"Der kleine Muskel spannt die Bindegewebslinie in der Mitte der unteren Bauchwand und fehlt bei vielen Menschen ganz.","merk":"Pyramidalis beschreibt die Form: ein Dreieck mit breiter Basis am Schambein und Spitze nach oben. Wer den Namen liest, kennt bereits das Aussehen."},{"lat":"M. obliquus externus abdominis","de":"äußerer schräger Bauchmuskel","part":"Abdomen und Becken","lead":"Oberflächlichster der seitlichen Bauchmuskeln; dreht den Rumpf zur Gegenseite.","kv":{"Regio":"Regio lateralis abdominis und Regio inguinalis (Flanke und Leistenregion)","Gruppe und Schicht":"Seitliche Bauchwand, äußere Schicht","Innervation":"Nn. intercostales Th5 bis Th12","Segment (Rückenmarkshöhe)":"Th5 bis Th12","Beteiligte Gelenke":"Brust- und Lendenwirbelsäule, Rippengelenke","Gliederung":"Einteilig mit acht Ursprungszacken"},"rows":[["Einseitige Kontraktion","Außenfläche der fünften bis zwölften Rippe","Crista iliaca, Aponeurose zur Linea alba, Lig. inguinale","Lateralflexion zur gleichen Seite, Rotation des Rumpfes zur Gegenseite"],["Beidseitige Kontraktion","Wie oben","Wie oben","Flexion des Rumpfes, Aufrichtung des Beckens, Bauchpresse, Absenkung der Rippen bei der Ausatmung"]],"sum":"Der äußere schräge Bauchmuskel neigt den Rumpf zur eigenen Seite und dreht ihn zur Gegenseite.","merk":"Hände in die Hosentaschen: In dieser Richtung verlaufen seine Fasern. Und weil er schräg nach vorn unten zieht, kann er nur zur Gegenseite drehen."},{"lat":"M. obliquus internus abdominis","de":"innerer schräger Bauchmuskel","part":"Abdomen und Becken","lead":"Mittlere Schicht der seitlichen Bauchwand; dreht den Rumpf zur gleichen Seite.","kv":{"Regio":"Regio lateralis abdominis und Regio inguinalis (Flanke und Leistenregion)","Gruppe und Schicht":"Seitliche Bauchwand, mittlere Schicht","Innervation":"Nn. intercostales Th8 bis Th12, N. iliohypogastricus und N. ilioinguinalis","Segment (Rückenmarkshöhe)":"Th8 bis L1","Beteiligte Gelenke":"Brust- und Lendenwirbelsäule, Rippengelenke","Gliederung":"Einteilig; unterste Fasern als M. cremaster abgespalten"},"rows":[["Einseitige Kontraktion","Fascia thoracolumbalis, Crista iliaca, laterale Hälfte des Lig. inguinale","Zehnter bis zwölfter Rippenknorpel, Aponeurose zur Linea alba","Lateralflexion und Rotation des Rumpfes zur gleichen Seite"],["Beidseitige Kontraktion","Wie oben","Wie oben","Flexion des Rumpfes, Bauchpresse, Absenkung der Rippen"]],"sum":"Der innere schräge Bauchmuskel neigt und dreht den Rumpf zu seiner eigenen Seite und sichert die Leistenregion.","merk":"Innen dreht nach innen: Der innere schräge Bauchmuskel dreht zur gleichen Seite, der äußere zur Gegenseite. Beide arbeiten immer über Kreuz."},{"lat":"M. transversus abdominis","de":"querer Bauchmuskel","part":"Abdomen und Becken","lead":"Innerste Schicht der Bauchwand; der eigentliche Bauchpressemuskel und tiefe Stabilisator der Lendenwirbelsäule.","kv":{"Regio":"Regio lateralis abdominis; umschließt gürtelförmig alle Bauchregionen","Gruppe und Schicht":"Seitliche Bauchwand, innerste Schicht; Teil des tiefen Stabilisationssystems","Innervation":"Nn. intercostales Th7 bis Th12, N. iliohypogastricus und N. ilioinguinalis","Segment (Rückenmarkshöhe)":"Th7 bis L1","Beteiligte Gelenke":"Lendenwirbelsäule, Iliosakralgelenk; wirkt über Druck statt über Hebel","Gliederung":"Einteilig; oberer, mittlerer und unterer Anteil mit leicht unterschiedlicher Funktion"},"rows":[["Einteiliger Muskel","Innenfläche des siebten bis zwölften Rippenknorpels, Fascia thoracolumbalis, Crista iliaca, laterales Drittel des Lig. inguinale","Aponeurose zur Linea alba","Verkleinert den Bauchumfang, erhöht den intraabdominellen Druck, spannt die Fascia thoracolumbalis und sichert damit die Lendenwirbelsäule segmental"]],"sum":"Der quere Bauchmuskel schnürt den Bauch wie ein Gürtel ein und stützt damit die Lendenwirbelsäule von inn gang","Zieht den Mastdarm nach ventral und erzeugt den anorektalen Winkel; wichtigster Muskel der Stuhlkontinenz"],["M. pubococcygeus","Innenfläche des Os pubis","Os coccygis, Lig. anococcygeum, Centrum tendineum perinei","Hebt den Beckenboden, unterstützt den Verschluss von Harnröhre und Scheide"],["M. iliococcygeus","Arcus tendineus musculi levatoris ani, Spina ischiadica","Lig. anococcygeum, Os coccygis","Bildet die flächige Platte; trägt die Beckenorgane"],["M. coccygeus oder ischiococcygeus","Spina ischiadica, Lig. sacrospinale","Os coccygis, unterer Anteil des Os sacrum","Schließt das Diaphragma nach dorsal, stabilisiert das Steißbein"]],"sum":"Diese Muskelplatte trägt von unten die Organe des Beckens, hält Harn und Stuhl zurück und arbeitet bei jedem Atemzug mit dem Zwerchfell zusammen.","merk":"Levator ani heißt Heber des Afters. Die drei Anteile tragen ihre Enden im Namen: pubo-rectalis vom Schambein zum Mastdarm, pubo-coccygeus zum Steißbein, ilio-coccygeus vom Darmbein zum Steißbein."},{"lat":"Diaphragma urogenitale et Mm. perinei","de":"Dammmuskulatur, äußere Schicht","part":"Abdomen und Becken","lead":"Quer gespannte äußere Beckenbodenplatte mit den Schließ- und Schwellkörpermuskeln des Dammes.","kv":{"Regio":"Regio perinealis mit Trigonum urogenitale und Trigonum anale (Dammregion)","Gruppe und Schicht":"Beckenboden, mittlere und oberflächliche Schicht","Innervation":"N. pudendus","Segment (Rückenmarkshöhe)":"S2 bis S4","Beteiligte Gelenke":"Kein eigenes Gelenk; funktionelle Verbindung zu Symphyse und Sitzbein","Gliederung":"Mittlere Schicht als Diaphragma urogenitale, oberflächliche Schicht als Schließ- und Schwellkörpermuskulatur"},"rows":[["M. transversus perinei profundus","Ramus inferior ossis pubis, Ramus ossis ischii","Centrum tendineum perinei, Umgebung der Harnröhre","Spannt die quere Platte des Trigonum urogenitale, sichert die Harnröhre"],["M. sphincter urethrae externus","Eingelagert in das Diaphragma urogenitale","Umschließt die Harnröhre","Willkürlicher Verschluss der Harnröhre"],["M. transversus perinei superficialis","Tuber ischiadicum","Centrum tendineum perinei","Fixiert den Dammkörper in der Mitte"],["M. sphincter ani externus","Lig. anococcygeum, Centrum tendineum perinei","Umschließt den Analkanal in Pars subcutanea, superficialis und profunda","Willkürlicher Verschluss des Afters"],["M. ischiocavernosus","Ramus ossis ischii, Tuber ischiadicum","Crus penis beziehungsweise Crus clitoridis","Presst Blut in den Schwellkörper und unterhält die Erektion"],["M. bulbospongiosus","Centrum tendineum perinei, Raphe perinei","Bulbus penis und Fascia penis beziehungsweise Bulbus vestibuli","Entleert die Harnröhre am Ende der Miktion, wirkt beim Erektionsvorgang mit"]],"sum":"Diese äußerste Schicht des Beckenbodens verschließt Harnröhre und After willkürlich und versorgt die Schwellkörper.","merk":"Drei Schichten von innen nach außen: Diaphragma pelvis trägt, Diaphragma urogenitale spannt quer, die Schließmuskelschicht verschließt. Alle treffen sich im Dammkörper, dem Centrum tendineum perinei."},{"lat":"M. deltoideus","de":"Deltamuskel","part":"Obere Extremität","lead":"Dreiteiliger Schultermuskel; Hauptabduktor des Arms.","kv":{"Regio":"Regio deltoidea (Schulterregion)","Gruppe und Schicht":"Schultergelenkmuskulatur, oberflächliche Schicht","Innervation":"N. axillaris","Segment (Rückenmarkshöhe)":"C5–C6","Beteiligte Gelenke":"Schultergelenk","Gliederung":"Drei Anteile mit teils gegensätzlicher Funktion, gemeinsamer Ansatz"},"rows":[["Pars clavicularis","Laterales Drittel der Clavicula","Tuberositas deltoidea humeri","Flexion, Innenrotation, Adduktion unterhalb von 60 Grad"],["Pars acromialis","Acromion","Tuberositas deltoidea humeri","Abduktion ab etwa 15 Grad über die Horizontale hinaus"],["Pars spinalis","Spina scapulae","Tuberositas deltoidea humeri","Extension, Außenrotation, Adduktion unterhalb von 60 Grad"]],"sum":"Der Muskel hebt den Arm zur Seite; sein vorderer Anteil führt ihn nach vorn, der hintere nach hinten.","merk":"Delta bezeichnet die Dreiecksform. Drei Anteile entsprechen drei Bewegungsrichtungen."},{"lat":"M. supraspinatus","de":"Obergrätenmuskel","part":"Obere Extremität","lead":"Anteil der Rotatorenmanschette; leitet die Abduktion ein und zentriert den Oberarmkopf.","kv":{"Regio":"Regio scapularis, Fossa supraspinata (Schulterblattregion, Obergrätengrube)","Gruppe und Schicht":"Rotatorenmanschette, Schultergelenkmuskulatur","Innervation":"N. suprascapularis","Segment (Rückenmarkshöhe)":"C4–C6","Beteiligte Gelenke":"Schultergelenk","Gliederung":"Einteilig"},"rows":[["Gesamter Muskel","Fossa supraspinata scapulae, Fascia supraspinata","Tuberculum majus humeri, kraniale Facette","Einleitung der Abduktion bis etwa 30 Grad, Zentrierung des Humeruskopfes, geringe Außenrotation"]],"sum":"Der Muskel beginnt das Anheben des Arms und hält den Oberarmkopf in der Gelenkpfanne.","merk":"Supra bedeutet oberhalb: er liegt über der Schulterblattgräte. Seine Sehne läuft durch den Engpass unter dem Schulterdach und ist deshalb am häufigsten betroffen."},{"lat":"M. infraspinatus","de":"Untergrätenmuskel","part":"Obere Extremität","lead":"Kräftigster Außenrotator des Schultergelenks; Anteil der Rotatorenmanschette.","kv":{"Regio":"Regio scapularis, Fossa infraspinata (Schulterblattregion, Untergrätengrube)","Gruppe und Schicht":"Rotatorenmanschette, Schultergelenkmuskulatur","Innervation":"N. suprascapularis","Segment (Rückenmarkshöhe)":"C4–C6","Beteiligte Gelenke":"Schultergelenk","Gliederung":"Kraniale und kaudale Faseranteile mit unterschiedlicher Nebenwirkung"},"rows":[["Kraniale Fasern","Fossa infraspinata scapulae, kranialer Abschnitt","Tuberculum majus humeri, mittlere Facette","Außenrotation, unterstützt die Abduktion"],["Kaudale Fasern","Fossa infraspinata scapulae, kaudaler Abschnitt","Tuberculum majus humeri, mittlere Facette","Außenrotation, unterstützt die Adduktion, kaudale Zentrierung"]],"sum":"Der Muskel dreht den Oberarm nach außen und hält den Gelenkkopf nach hinten zentriert.","merk":"Infra bedeutet unterhalb: er liegt unter der Schulterblattgräte. Er ist der Hauptaußenrotator und arbeitet gegen Pectoralis und Latissimus."},{"lat":"M. teres minor","de":"kleiner Rundmuskel","part":"Obere Extremität","lead":"Kleinster Anteil der Rotatorenmanschette; Außenrotator.","kv":{"Regio":"Regio scapularis, lateraler Rand des Schulterblatts","Gruppe und Schicht":"Rotatorenmanschette, Schultergelenkmuskulatur","Innervation":"N. axillaris","Segment (Rückenmarkshöhe)":"C5–C6","Beteiligte Gelenke":"Schultergelenk","Gliederung":"Einteilig"},"rows":[["Gesamter Muskel","Margo lateralis scapulae, mittleres Drittel","Tuberculum majus humeri, kaudale Facette","Außenrotation, Adduktion, kaudale Zentrierung des Humeruskopfes"]],"sum":"Der Muskel dreht den Oberarm nach außen und unterstützt dabei den Untergrätenmuskel.","merk":"Teres bedeutet rund. Der minor rotiert nach außen, der major nach innen: gleicher Namensstamm, entgegengesetzte Wirkung."},{"lat":"M. subscapularis","de":"Unterschulterblattmuskel","part":"Obere Extremität","lead":"Einziger Anteil der Rotatorenmanschette auf der Vorderseite; Innenrotator.","kv":{"Regio":"Regio scapularis, Vorderfläche des Schulterblatts, Fossa subscapularis","Gruppe und Schicht":"Rotatorenmanschette, Schultergelenkmuskulatur","Innervation":"Nn. subscapulares","Segment (Rückenmarkshöhe)":"C5–C6","Beteiligte Gelenke":"Schultergelenk","Gliederung":"Einteilig, mehrere Faserzüge mit gemeinsamer Endsehne"},"rows":[["Gesamter Muskel","Fossa subscapularis der Scapula","Tuberculum minus humeri","Innenrotation, Adduktion, ventrale Zentrierung des Humeruskopfes"]],"sum":"Der Muskel dreht den Oberarm nach innen und ist der einzige Teil der Rotatorenmanschette auf der Vorderseite.","merk":"Sub-scapularis bedeutet unter dem Schulterblatt, also auf dessen Vorderfläche. Ansatz am Tuberculum minus, alle übrigen Rotatoren am Tuberculum majus."},{"lat":"M. teres major","de":"großer Rundmuskel","part":"Obere Extremität","lead":"Funktioneller Partner des Latissimus; Innenrotator und Adduktor.","kv":{"Regio":"Regio scapularis und Regio axillaris; bildet die hintere Achselfalte","Gruppe und Schicht":"Schultergelenkmuskulatur, dorsale Gruppe","Innervation":"N. thoracodorsalis","Segment (Rückenmarkshöhe)":"C6–C7","Beteiligte Gelenke":"Schultergelenk","Gliederung":"Einteilig"},"rows":[["Gesamter Muskel","Angulus inferior scapulae, dorsale Fläche","Crista tuberculi minoris humeri","Innenrotation, Adduktion, Extension im Schultergelenk"]],"sum":"Der Muskel zieht den Arm an den Rumpf und dreht ihn nach innen.","merk":"Funktionell nahezu identisch mit dem M. latissimus dorsi; der Unterschied liegt im Ursprung: Schulterblatt gegenüber Becken."},{"lat":"M. coracobrachialis","de":"Rabenschnabel-Oberarm-Muskel","part":"Obere Extremität","lead":"Schlanker Muskel an der Innenseite des Oberarms; führt den Arm nach vorn und heran.","kv":{"Regio":"Regio axillaris und Regio brachialis anterior (Achselregion, vordere Oberarmregion)","Gruppe und Schicht":"Ventrale Oberarmloge (Beugerloge)","Innervation":"N. musculocutaneus","Segment (Rückenmarkshöhe)":"C6 bis C7","Beteiligte Gelenke":"Schultergelenk","Gliederung":"Einteilig; gemeinsamer Ursprung mit dem Caput breve des M. biceps brachii"},"rows":[["Einteiliger Muskel","Processus coracoideus scapulae","Mediale Fläche des Humerusschafts auf halber Höhe","Anteversion und Adduktion im Schultergelenk, geringe Innenrotation; zentriert den Humeruskopf nach ventral"]],"sum":"Der Muskel zieht den Arm nach vorn und an den Körper heran und hält den Oberarmkopf in der Pfanne.","merk":"Der Name nennt Anfang und Ende: coraco vom Rabenschnabelfortsatz, brachialis zum Oberarm. Drei Strukturen entspringen am Processus coracoideus: Bizeps kurzer Kopf, Coracobrachialis und Pectoralis minor."},{"lat":"M. biceps brachii","de":"zweiköpfiger Armbeuger","part":"Obere Extremität","lead":"Zweiköpfiger Ellbogenbeuger und stärkster Supinator des Unterarms.","kv":{"Regio":"Regio brachialis anterior (vordere Oberarmregion)","Gruppe und Schicht":"Ventrale Oberarmloge (Beugerloge)","Innervation":"N. musculocutaneus","Segment (Rückenmarkshöhe)":"C5–C6","Beteiligte Gelenke":"Ellbogengelenk, Radioulnargelenke, Schultergelenk","Gliederung":"Zwei Köpfe mit unterschiedlichem Ursprung an der Scapula"},"rows":[["Caput longum","Tuberculum supraglenoidale scapulae","Tuberositas radii, Aponeurosis bicipitalis","Flexion, Supination, unterstützt die Abduktion und zentriert den Humeruskopf"],["Caput breve","Processus coracoideus scapulae","Tuberositas radii, Aponeurosis bicipitalis","Flexion, Supination, unterstützt die Adduktion"]],"sum":"Der Muskel beugt den Ellbogen und dreht dabei die Handfläche nach oben.","merk":"Biceps bedeutet zweiköpfig. Nur das Caput longum verläuft im Sulcus intertubercularis; dort liegt bei Tendinopathie der Schmerzpunkt."},{"lat":"M. brachialis","de":"Armbeuger","part":"Obere Extremität","lead":"Eingelenkiger Ellbogenbeuger; arbeitet unabhängig von der Unterarmstellung.","kv":{"Regio":"Regio brachialis anterior, tiefe Schicht","Gruppe und Schicht":"Ventrale Oberarmloge (Beugerloge)","Innervation":"N. musculocutaneus, Randbereiche auch N. radialis","Segment (Rückenmarkshöhe)":"C5–C6","Beteiligte Gelenke":"Ellbogengelenk","Gliederung":"Einteilig"},"rows":[["Gesamter Muskel","Humerusvorderfläche, distale Hälfte, Septa intermuscularia","Tuberositas ulnae","Flexion im Ellbogengelenk in jeder Unterarmstellung"]],"sum":"Der Muskel beugt den Ellbogen unabhängig davon, wie die Hand gedreht ist.","merk":"Der eigentliche Arbeitsbeuger des Ellbogens. Getestet wird er in Pronation, weil der Bizeps dort kaum beiträgt."},{"lat":"M. triceps brachii","de":"dreiköpfiger Armstrecker","part":"Obere Extremität","lead":"Einziger Extensor des Ellbogengelenks.","kv":{"Regio":"Regio brachialis posterior (hintere Oberarmregion)","Gruppe und Schicht":"Dorsale Oberarmloge (Streckerloge)","Innervation":"N. radialis","Segment (Rückenmarkshöhe)":"C6–C8","Beteiligte Gelenke":"Ellbogengelenk; Schultergelenk nur über das Caput longum","Gliederung":"Drei Köpfe, von denen einer zwei Gelenke überspannt"},"rows":[["Caput longum","Tuberculum infraglenoidale scapulae","Olecranon ulnae","Extension im Ellbogen, Extension und Adduktion im Schultergelenk"],["Caput laterale","Humerusrückfläche proximal und lateral des Sulcus n. radialis","Olecranon ulnae","Extension im Ellbogengelenk"],["Caput mediale","Humerusrückfläche distal und medial des Sulcus n. radialis","Olecranon ulnae","Extension im Ellbogengelenk, besonders endgradig"]],"sum":"Der Muskel streckt den Ellbogen; nur einer seiner drei Köpfe bewegt zusätzlich die Schulter.","merk":"Allein das Caput longum überspannt zwei Gelenke und wird daher in Elevation gedehnt. Triceps bedeutet dreiköpfig."},{"lat":"M. anconeus","de":"Knorrenmuskel","part":"Obere Extremität","lead":"Kleiner dreieckiger Muskel an der Außenseite des Ellbogens; unterstützt die Streckung und spannt die Gelenkkapsel.","kv":{"Regio":"Regio cubitalis posterior (hintere Ellbogenregion)","Gruppe und Schicht":"Dorsale Oberarmloge (Streckerloge), Übergang zum Unterarm","Innervation":"N. radialis","Segment (Rückenmarkshöhe)":"C7 bis C8","Beteiligte Gelenke":"Ellbogengelenk, insbesondere Art. humeroulnaris","Gliederung":"Einteilig"},"rows":[["Einteiliger Muskel","Epicondylus lateralis humeri, dorsal","Olecranon und dorsale Fläche der proximalen Ulna","Unterstützt die Ellbogenstreckung, spannt die Gelenkkapsel und sichert die Ulna bei der Umwendbewegung"]],"sum":"Der kleine Muskel hinter dem Ellbogen hilft beim Strecken und hält die Gelenkkapsel aus dem Weg.","merk":"Ankon ist das griechische Wort für Ellbogen. Der Muskel trägt also schlicht den Namen des Gelenks, an dem er liegt."},{"lat":"M. brachioradialis","de":"Speichenmuskel","part":"Obere Extremität","lead":"Radialer Unterarmmuskel; beugt den Ellbogen in Mittelstellung.","kv":{"Regio":"Regio antebrachialis anterior, radialer Rand (Speichenseite des Unterarms)","Gruppe und Schicht":"Radiale Gruppe des Unterarms","Innervation":"N. radialis","Segment (Rückenmarkshöhe)":"C5–C6","Beteiligte Gelenke":"Ellbogengelenk, Radioulnargelenke","Gliederung":"Einteilig"},"rows":[["Gesamter Muskel","Margo lateralis humeri, Septum intermusculare laterale","Processus styloideus radii","Flexion im Ellbogen; Einstellung des Unterarms zur Mittelstellung, also Supination aus Pronation und Pronation aus Supination"]],"sum":"Der Muskel beugt den Ellbogen, wenn der Daumen nach oben zeigt.","merk":"Der Name benennt Ursprung und Ansatz: vom Oberarm (Brachium) zur Speiche (Radius)."},{"lat":"M. pronator teres","de":"runder Einwärtsdreher","part":"Obere Extremität","lead":"Oberflächlicher Unterarmmuskel; dreht die Hand nach innen und beugt den Ellbogen.","kv":{"Regio":"Regio cubitalis anterior und Regio antebrachialis anterior (Ellenbeuge, Beugeseite des Unterarms)","Gruppe und Schicht":"Ventrale Unterarmloge, oberflächliche Schicht","Innervation":"N. medianus","Segment (Rückenmarkshöhe)":"C6 bis C7","Beteiligte Gelenke":"Ellbogengelenk, proximales und distales Radioulnargelenk","Gliederung":"Zwei Köpfe: Caput humerale und Caput ulnare"},"rows":[["Caput humerale","Epicondylus medialis humeri, Septum intermusculare","Facies lateralis des Radius auf halber Höhe, Tuberositas pronatoria","Pronation des Unterarms, Beugung im Ellbogengelenk"],["Caput ulnare","Processus coronoideus ulnae","Gemeinsam mit dem Caput humerale","Verstärkt die Pronation; bildet mit dem anderen Kopf den Durchtritt für den N. medianus"]],"sum":"Der Muskel dreht die Handfläche nach unten und hilft beim Beugen des Ellbogens.","merk":"Pronare heißt vorwärts neigen, teres rund. Der runde Einwärtsdreher liegt oben, der viereckige unten: pronator teres proximal, pronator quadratus distal."},{"lat":"M. flexor carpi radialis","de":"speichenseitiger Handbeuger","part":"Obere Extremität","lead":"Oberflächlicher Beuger auf der Speichenseite; beugt die Hand und führt sie nach radial.","kv":{"Regio":"Regio antebrachialis anterior (Beugeseite des Unterarms)","Gruppe und Schicht":"Ventrale Unterarmloge, oberflächliche Schicht","Innervation":"N. medianus","Segment (Rückenmarkshöhe)":"C6 bis C7","Beteiligte Gelenke":"Handgelenk, Karpometakarpalgelenk, geringfügig Ellbogengelenk","Gliederung":"Einteilig"},"rows":[["Einteiliger Muskel","Epicondylus medialis humeri, Caput commune der Flexoren","Basis des zweiten Mittelhandknochens, palmar; Nebenzug zum dritten","Palmarflexion und Radialabduktion der Hand; unterstützt die Pronation und geringfügig die Ellbogenbeugung"]],"sum":"Der Muskel beugt die Hand nach innen und zieht sie zugleich zur Daumenseite.","merk":"Der Name liest sich in drei Schritten: flexor beugt, carpi das Handgelenk, radialis auf der Speichenseite. Nach demselben Muster gebaut sind flexor carpi ulnaris, extensor carpi radialis und extensor carpi ulnaris."},{"lat":"M. palmaris longus","de":"langer Hohlhandmuskel","part":"Obere Extremität","lead":"Schwacher oberflächlicher Beuger mit langer Sehne; spannt die Palmaraponeurose und fehlt bei vielen Menschen.","kv":{"Regio":"Regio antebrachialis anterior und Regio carpalis anterior (Beugeseite von Unterarm und Handgelenk)","Gruppe und Schicht":"Ventrale Unterarmloge, oberflächliche Schicht","Innervation":"N. medianus","Segment (Rückenmarkshöhe)":"C7 bis C8","Beteiligte Gelenke":"Handgelenk","Gliederung":"Einteilig; inkonstant angelegt"},"rows":[["Einteiliger Muskel","Epicondylus medialis humeri, Caput commune der Flexoren","Retinaculum musculorum flexorum und Aponeurosis palmaris","Spannt die Palmaraponeurose, unterstützt schwach die Palmarflexion"]],"sum":"Der Muskel spannt die Sehnenplatte der Hohlhand und fehlt bei etwa jedem achten Menschen ganz.","merk":"Seine Sehne ist die Wegmarke für den Mittelnerv: Der N. medianus liegt unmittelbar daneben, zur Kleinfingerseite hin. Wer die Sehne findet, findet den Nerv."},{"lat":"M. flexor carpi ulnaris","de":"ellenseitiger Handbeuger","part":"Obere Ex Hand"],["Caput radiale","Facies anterior des Radius, proximales Drittel","Gemeinsam mit dem anderen Kopf","Verstärkt den Zug; bildet mit dem Caput humeroulnare den Sehnenbogen über dem N. medianus"]],"sum":"Der Muskel beugt die Mittelgelenke der Finger und leistet den größten Teil des Faustschlusses.","merk":"Oberflächlich beugt das Mittelgelenk, tief beugt das Endgelenk. Der tiefe Beuger muss weiter reichen, also schlüpft seine Sehne durch die gespaltene Sehne des oberflächlichen hindurch."},{"lat":"M. flexor digitorum profundus","de":"tiefer Fingerbeuger","part":"Obere Extremität","lead":"Einziger Beuger der Fingerendgelenke; Muskel mit den meisten überquerten Gelenken des Körpers.","kv":{"Regio":"Regio antebrachialis anterior, tiefe Schicht","Gruppe und Schicht":"Ventrale Unterarmloge, tiefe Schicht","Innervation":"Radiale Hälfte N. interosseus antebrachii anterior aus dem N. medianus, ulnare Hälfte N. ulnaris","Segment (Rückenmarkshöhe)":"C7 bis Th1","Beteiligte Gelenke":"Handgelenk sowie Grund-, Mittel- und Endgelenke der Finger zwei bis fünf","Gliederung":"Einheitlicher Muskelbauch mit vier Endsehnen und geteilter Innervation"},"rows":[["Radiale Hälfte, Finger zwei und drei","Facies anterior und medialis der Ulna, Membrana interossea","Endglieder des Zeige- und Mittelfingers, palmar","Beugung der Endgelenke; feinmotorischer Präzisionsgriff"],["Ulnare Hälfte, Finger vier und fünf","Facies anterior und medialis der Ulna","Endglieder von Ring- und Kleinfinger, palmar","Beugung der Endgelenke; Kraftgriff"],["Gesamtwirkung","Wie oben","Wie oben","Beugung sämtlicher Fingergelenke und des Handgelenks; Ursprung der Mm. lumbricales"]],"sum":"Der Muskel beugt die Fingerendglieder und schließt damit jeden Griff ab.","merk":"Der Muskel mit den meisten überquerten Gelenken des Körpers. Und der einzige, dessen Muskelbauch von zwei verschiedenen Nerven versorgt wird: Medianus radial, Ulnaris ulnar."},{"lat":"M. flexor pollicis longus","de":"langer Daumenbeuger","part":"Obere Extremität","lead":"Einziger Beuger des Daumenendglieds; liegt in der tiefen Beugerschicht.","kv":{"Regio":"Regio antebrachialis anterior, tiefe Schicht, radialer Anteil","Gruppe und Schicht":"Ventrale Unterarmloge, tiefe Schicht","Innervation":"N. interosseus antebrachii anterior aus dem N. medianus","Segment (Rückenmarkshöhe)":"C7 bis Th1","Beteiligte Gelenke":"Handgelenk, Daumensattelgelenk, Daumengrund- und Daumenendgelenk","Gliederung":"Einteilig"},"rows":[["Einteiliger Muskel","Facies anterior des Radius, Membrana interossea, gelegentlich Processus coronoideus ulnae","Basis der Endphalanx des Daumens, palmar","Beugung des Daumenendgelenks und des Grundgelenks; unterstützt Opposition und Palmarflexion der Hand"]],"sum":"Der Muskel beugt das Endglied des Daumens und liefert die Kraft beim Zusammenführen von Daumen und Zeigefinger.","merk":"Pollicis heißt des Daumens. Jeder Muskel mit pollicis im Namen wirkt auf den Daumen, und longus sagt, dass er vom Unterarm kommt; die kurzen Daumenmuskeln mit brevis liegen im Daumenballen selbst."},{"lat":"M. pronator quadratus","de":"viereckiger Einwärtsdreher","part":"Obere Extremität","lead":"Tiefster Muskel des distalen Unterarms; eigentlicher Motor der Pronation und Klammer der Unterarmknochen.","kv":{"Regio":"Regio antebrachialis anterior, distales Viertel, tiefste Schicht","Gruppe und Schicht":"Ventrale Unterarmloge, tiefste Schicht","Innervation":"N. interosseus antebrachii anterior aus dem N. medianus","Segment (Rückenmarkshöhe)":"C7 bis Th1","Beteiligte Gelenke":"Distales Radioulnargelenk","Gliederung":"Oberflächliche und tiefe Faserschicht mit unterschiedlicher Aufgabe"},"rows":[["Oberflächliche Fasern","Facies anterior der distalen Ulna","Facies anterior des distalen Radius","Pronation des Unterarms; arbeitet in jeder Stellung und bei jeder Geschwindigkeit"],["Tiefe Fasern","Facies anterior der distalen Ulna, schräg verlaufend","Distaler Radius","Presst Radius und Ulna aneinander und sichert das distale Radioulnargelenk gegen Aufklappen"]],"sum":"Der Muskel dreht die Handfläche nach unten und hält dabei Speiche und Elle am Handgelenk zusammen.","merk":"Quadratus heißt viereckig. Der viereckige Pronator liegt unten am Handgelenk, der runde oben am Ellbogen. Wer bei gebeugtem Ellbogen proniert, prüft den unteren."},{"lat":"M. extensor carpi radialis longus","de":"langer speichenseitiger Handstrecker","part":"Obere Extremität","lead":"Radialer Handgelenkstrecker mit langem Hebel; streckt die Hand und führt sie zur Daumenseite.","kv":{"Regio":"Regio antebrachialis posterior, radialer Rand (Streckseite, Speichenseite)","Gruppe und Schicht":"Radiale Gruppe des Unterarms","Innervation":"N. radialis, Hauptstamm","Segment (Rückenmarkshöhe)":"C6 bis C7","Beteiligte Gelenke":"Handgelenk, geringfügig Ellbogengelenk","Gliederung":"Einteilig"},"rows":[["Einteiliger Muskel","Crista supracondylaris lateralis humeri, Septum intermusculare laterale","Basis des zweiten Mittelhandknochens, dorsal","Dorsalextension und Radialabduktion der Hand; unterstützt die Ellbogenbeugung"]],"sum":"Der Muskel streckt die Hand nach oben und zur Daumenseite und stabilisiert das Handgelenk bei jedem Griff.","merk":"Longus entspringt oberhalb des Epicondylus lateralis, brevis am Epicondylus selbst. Der weiter proximal gelegene Ursprung macht den Muskel länger; genau das benennt der Zusatz longus."},{"lat":"M. extensor carpi radialis brevis","de":"kurzer speichenseitiger Handstrecker","part":"Obere Extremität","lead":"Zweiter radialer Handstrecker; Hauptursprungsort der Epicondylitis lateralis.","kv":{"Regio":"Regio antebrachialis posterior, radialer Rand (Streckseite, Speichenseite)","Gruppe und Schicht":"Radiale Gruppe des Unterarms","Innervation":"N. radialis, R. profundus","Segment (Rückenmarkshöhe)":"C7 bis C8","Beteiligte Gelenke":"Handgelenk","Gliederung":"Einteilig"},"rows":[["Einteiliger Muskel","Epicondylus lateralis humeri, Caput commune der Extensoren, Lig. anulare radii","Basis des dritten Mittelhan  und des Foramen obturatum","Fossa trochanterica des Femur","Außenrotation der Hüfte; bei flektierter Hüfte zunehmend Abduktion; zentriert den Hüftkopf in der Pfanne"],["M. gemellus superior","Spina ischiadica","Gemeinsam mit dem M. obturatorius internus","Verstärkt die Außenrotation"],["M. gemellus inferior","Tuber ischiadicum, oberer Rand","Gemeinsam mit dem M. obturatorius internus","Verstärkt die Außenrotation"]],"sum":"Diese drei tiefen Muskeln drehen das Bein nach außen und halten den Hüftkopf in seiner Pfanne.","merk":"Internus kommt von innen und biegt um die Spina ischiadica wie ein Seil um eine Umlenkrolle. Die beiden Gemelli, die Zwillinge, legen sich ihm dabei von oben und unten an."},{"lat":"M. obturatorius externus et M. quadratus femoris","de":"äußerer Hüftlochmuskel und viereckiger Schenkelmuskel","part":"Untere Extremität","lead":"Die beiden kaudalen Außenrotatoren der pelvitrochantären Gruppe.","kv":{"Regio":"Regio glutea, tiefste Schicht, und Umgebung des Foramen obturatum","Gruppe und Schicht":"Pelvitrochantäre Muskulatur (tiefe Außenrotatoren)","Innervation":"M. obturatorius externus N. obturatorius; M. quadratus femoris direkte Äste des Plexus sacralis","Segment (Rückenmarkshöhe)":"L3 bis S1","Beteiligte Gelenke":"Hüftgelenk","Gliederung":"Zwei getrennte Muskeln mit gleicher Hauptfunktion"},"rows":[["M. obturatorius externus","Außenfläche der Membrana obturatoria und des knöchernen Randes des Foramen obturatum","Fossa trochanterica des Femur","Außenrotation und Adduktion der Hüfte; sichert den Schenkelhals von kaudal"],["M. quadratus femoris","Tuber ischiadicum, lateraler Rand","Crista intertrochanterica, Tuberculum quadratum","Außenrotation und Adduktion der Hüfte; kräftigster der tiefen Außenrotatoren"]],"sum":"Die beiden Muskeln drehen das Bein nach außen und ziehen es zugleich zum anderen Bein hin.","merk":"Internus liegt innen im Becken und tritt seitlich heraus, externus liegt außen und zieht unter dem Schenkelhals hindurch. Quadratus femoris beschreibt schlicht die viereckige Form."},{"lat":"M. sartorius","de":"Schneidermuskel","part":"Untere Extremität","lead":"Längster Muskel des Körpers; beugt, abduziert und außenrotiert die Hüfte und beugt zugleich das Knie.","kv":{"Regio":"Regio femoralis anterior; bildet die laterale Begrenzung des Trigonum femorale","Gruppe und Schicht":"Ventrale Oberschenkelloge (Extensorenloge)","Innervation":"N. femoralis","Segment (Rückenmarkshöhe)":"L2 bis L3","Beteiligte Gelenke":"Hüftgelenk und Kniegelenk; zweigelenkig","Gliederung":"Einteilig"},"rows":[["Wirkung auf die Hüfte","Spina iliaca anterior superior","Pes anserinus superficialis an der Tuberositas tibiae, medial","Flexion, Abduktion und Außenrotation im Hüftgelenk"],["Wirkung auf das Knie","Wie oben","Wie oben","Flexion und Innenrotation im Kniegelenk bei gebeugtem Knie"]],"sum":"Der längste Muskel des Körpers führt das Bein in die Schneidersitzstellung: Hüfte beugen, abspreizen, nach außen drehen, Knie beugen.","merk":"Sartor ist lateinisch für Schneider. Wer die Schneidersitzstellung einnimmt, führt genau die vier Bewegungen aus, die dieser Muskel leistet. Für den Pes anserinus ist die englische Merkhilfe Say Grace before Tea überliefert: Sartorius, Gracilis, semiTendinosus, in dieser Reihenfolge von ventral nach dorsal."},{"lat":"M. quadriceps femoris","de":"vierköpfiger Oberschenkelstrecker","part":"Untere Extremität","lead":"Vierköpfiger Kniestrecker; ein Kopf wirkt zusätzlich auf das Hüftgelenk.","kv":{"Regio":"Regio femoralis anterior (Vorderseite des Oberschenkels)","Gruppe und Schicht":"Ventrale Oberschenkelloge (Extensorenloge)","Innervation":"N. femoralis","Segment (Rückenmarkshöhe)":"L2–L4","Beteiligte Gelenke":"Kniegelenk; Hüftgelenk nur über den M. rectus femoris","Gliederung":"Vier Köpfe, davon einer zweigelenkig"},"rows":[["M. rectus femoris","Spina iliaca anterior inferior, kranialer Pfannenrand","Basis patellae, über das Lig. patellae zur Tuberositas tibiae","Extension im Knie und Flexion in der Hüfte"],["M. vastus medialis","Labium mediale der Linea aspera femoris","Patella medial, Tuberositas tibiae","Extension im Knie, mediale Führung der Patella"],["M. vastus lateralis","Labium laterale der Linea aspera, Trochanter major","Patella lateral, Tuberositas tibiae","Extension im Knie; kräftigster Anteil"],["M. vastus intermedius","Vorderfläche des Femurschafts","Basis patellae, Tuberositas tibiae","Extension im Kniegelenk"]],"sum":"Der Muskel streckt das Knie; von seinen vier Köpfen beugt nur der oberste zusätzlich die Hüfte.","merk":"Drei Vasti wirken nur über das Knie, der Rectus femoris auch über die Hüfte. Daher erfolgt seine Dehnung in Bauchlage mit aufgerichtetem Becken."},{"lat":"M. pectineus","de":"Kammmuskel","part":"Untere Extremität","lead":"Oberster Muskel der Adduktorengruppe; beugt und adduziert die Hüfte.","kv":{"Regio":"Trigonum femorale (Leistendreieck), Boden der Fossa iliopectinea","Gruppe und Schicht":"Mediale Oberschenkelloge (Adduktorenloge)","Innervation":"N. femoralis, zusätzlich häufig N. obturatorius","Segment (Rückenmarkshöhe)":"L2 bis L3","Beteiligte Gelenke":"Hüftgelenk","Gliederung":"Einteilig"},"rows":[["Einteiliger Muskel","Pecten ossis pubis, Eminentia iliopubica","Linea pectinea des Femur, unterhalb des Trochanter minor","Adduktion, Flexion und geringe Außenrotation im Hüftgelenk"]],"sum":"Der Muskel zieht das Bein zur Mitte und zugleich nach vorn; er liegt zuoberst in der Adduktorengruppe.","merk":"Pecten heißt Kamm; gemeint ist der Schambeinkamm, an dem er entspringt. Der Name nennt also unmittelbar den Ursprungsort."},{"lat":"Mm. adductores","de":"Adduktorengruppe","part":"Untere Extremität","lead":"Mediale Oberschenkelloge; führt das Bein zur Körpermitte und stabilisiert das Becken.","kv":{"Regio":"Regio femoralis anterior, medialer Anteil (Innenseite des Oberschenkels)","Gruppe und Schicht":"Mediale Oberschenkelloge (Adduktorenloge)","Innervation":"N. obturatorius; ischiocondylärer Anteil des M. adductor magnus über den N. tibialis, M. pectineus zusätzlich N. femoralis","Segment (Rückenmarkshöhe)":"L2–L4","Beteiligte Gelenke":"Hüftgelenk; M. gracilis zusätzlich Kniegelenk","Gliederung":"Fünf eigenständige Muskeln derselben Loge"},"rows":[["M. adductor longus","Os pubis, ventral unterhalb des Tuberculum pubicum","Labium mediale der Linea aspera, mittleres Drittel","Adduktion, Flexion bis etwa 70 Grad, Außenrotation"],["M. adductor brevis","Ramus inferior ossis pubis","Labium mediale der Linea aspera, proximales Drittel","Adduktion, Flexion, Außenrotation"],["M. adductor magnus","Ramus inferior ossis pubis, Tuber ischiadicum","Labium mediale der Linea aspera, Tuberculum adductorium","Adduktion; ischiocondyläre Fasern zusätzlich Extension der Hüfte"],["M. gracilis","Ramus inferior ossis pubis","Tibia medial, Pes anserinus superficialis","Adduktion, Flexion und Innenrotation im Knie; einziger zweigelenkiger Adduktor"],["M. pectineus","Pecten ossis pubis","Linea pectinea femoris","Adduktion, Flexion, Außenrotation"]],"sum":"Die Gruppe führt das Bein zur Körpermitte und hält das Becken zur Seite hin stabil.","merk":"Der M. gracilis ist der einzige Adduktor, der über das Knie zieht. Der M. adductor magnus streckt zusätzlich die Hüfte und gehört funktionell halb zu den Streckern."},{"lat":"M. adductor longus et M. adductor brevis","de":"langer und kurzer Anzieher","part":"Untere Extremität","lead":"Die beiden oberflächlichen Adduktoren; sie führen das Bein zur Körpermitte und beugen die Hüfte leicht.","kv":{"Regio":"Regio femoralis anterior, medialer Anteil, oberflächliche und mittlere Schicht","Gruppe und Schicht":"Mediale Oberschenkelloge (Adduktorenloge), oberflächliche und mittlere Schicht","Innervation":"N. obturatorius, R. anterior","Segment (Rückenmarkshöhe)":"L2 bis L4","Beteiligte Gelenke":"Hüftgelenk","Gliederung":"Zwei getrennte Muskeln in benachbarten Schichten"},"rows":[["M. adductor longus","Ramus superior ossis pubis, unterhalb des Tuberculum pubicum","Labium mediale der Linea aspera, mittleres Drittel","Adduktion, Flexion bis etwa siebzig Grad Hüftbeugung, darüber hinaus Extension; geringe Außenrotation"],["M. adductor brevis","Ramus inferior ossis pubis","Labium mediale der Linea aspera, proximales Drittel","Adduktion und Flexion im Hüftgelenk; stabilisiert das Becken in der Frontalebene"]],"sum":"Die beiden Muskeln ziehen das Bein zur Körpermitte und bremsen im Gang das seitliche Wegkippen des Beckens.","merk":"Drei Adduktoren in drei Schichten von vorn nach hinten: longus vorn, brevis in der Mitte, magnus hinten. Der Name magnus ohne Gegenstück zeigt schon an, dass er der größte ist."},{"lat":"M. adductor magnus","de":"großer Anzieher","part":"Untere Extremität","lead":"Größter Adduktor; sein hinterer Anteil arbeitet funktionell wie ein ischiokruraler Muskel.","kv":{"Regio":"Regio femoralis anterior, medialer Anteil, tiefe Schicht; hinterer Anteil bis zur Regio femoralis posterior","Gruppe und Schicht":"Mediale Oberschenkelloge (Adduktorenloge), tiefe Schicht; hinterer Anteil funktionell ischiokrural","Innervation":"Vorderer Anteil N. obturatorius, hinterer Anteil N. tibialis aus dem N. ischiadicus","Segment (Rückenmarkshöhe)":"L2 bis S1","Beteiligte Gelenke":"Hüftgelenk; über den hinteren Anteil indirekt auch das Kniegelenk","Gliederung":"Zwei Anteile mit getrennter Innervation und teils gegensätzlicher Funktion"},"rows":[["Vorderer, adduktorischer Anteil","Ramus inferior ossis pubis, Ramus ossis ischii","Labium mediale der Linea aspera in ganzer Länge","Adduktion, geringe Flexion und Außenrotation im Hüftgelenk"],["Hinterer, ischiokruraler Anteil","Tuber ischiadicum","Tuberculum adductorium am Epicondylus medialis femoris","Adduktion, Extension und Innenrotation im Hüftgelenk; kräftigster Hüftstrecker neben dem M. gluteus maximus"]],"sum":"Der größte Adduktor zieht das Bein zur Mitte, sein hinterer Anteil streckt zusätzlich kraftvoll die Hüfte.","merk":"Ein Muskel, zwei Nerven, zwei Funktionen: Wo der Ursprung liegt, bestimmt die Aufgabe. Vom Schambein aus adduziert er, vom Sitzbein aus streckt er wie ein ischiokruraler Muskel."},{"lat":"M. gracilis","de":"schlanker Muskel","part":"Untere Extremität","lead":"Einziger zweigelenkiger Adduktor; wirkt zugleich auf Hüfte und Knie.","kv":{"Regio":"Regio femoralis anterior, medialer Anteil, oberflächlichste Schicht; reicht bis zur Regio genus","Gruppe und Schicht":"Mediale Oberschenkelloge (Adduktorenloge), oberflächlichste Schicht","Innervation":"N. obturatorius, R. anterior","Segment (Rückenmarkshöhe)":"L2 bis L4","Beteiligte Gelenke":"Hüftgelenk und Kniegelenk; zweigelenkig","Gliederung":"Einteilig"},"rows":[["Wirkung auf die Hüfte","Ramus inferior ossis pubis, unterhalb der Symphyse","Pes anserinus superficialis medial an der Tuberositas tibiae","Adduktion und geringe Flexion im Hüftgelenk"],["Wirkung auf das Knie","Wie oben","Wie oben","Flexion und Innenrotation im Kniegelenk bei gebeugtem Knie"]],"sum":"Der schlanke Muskel zieht das Bein zur Mitte und beugt zusätzlich das Knie; er ist der einzige Adduktor, der bis unter das Knie reicht.","merk":"Gracilis heißt schlank. Und er ist der einzige Adduktor mit Wirkung auf das Knie, weil er als einziger das Kniegelenk überquert; das steht zwar nicht im Namen, folgt aber unmittelbar aus seiner Länge."},{"lat":"M. biceps femoris","de":"zweiköpfiger Schenkelmuskel","part":"Untere Extremität","lead":"Lateraler Anteil der ischiokruralen Gruppe; zwei Köpfe mit unterschiedlicher Innervation.","kv":{"Regio":"Regio femoralis posterior, lateraler Anteil; begrenzt die Fossa poplitea nach kraniolateral","Gruppe und Schicht":"Dorsale Oberschenkelloge (ischiokrurale Gruppe)","Innervation":"N. ischiadicus: Caput longum über den N. tibialis, Caput breve über den N. peroneus communis","Segment (Rückenmarkshöhe)":"L5–S2","Beteiligte Gelenke":"Kniegelenk; Hüftgelenk nur über das Caput longum","Gliederung":"Zwei Köpfe mit unterschiedlichem Ursprung und unterschiedlicher Innervation"},"rows":[["Caput longum","Tuber ischiadicum","Caput fibulae","Extension der Hüfte, Flexion im Knie, Außenrotation des Unterschenkels"],["Caput breve","Labium laterale der Linea aspera femoris","Caput fibulae","Flexion im Knie, Außenrotation des Unterschenkels; ohne Wirkung auf das Hüftgelenk"]],"sum":"Der Muskel streckt die Hüfte und beugt das Knie; er übernimmt Arbeit, wenn die Gesäßmuskulatur zu wenig beiträgt.","merk":"Das Caput breve ist der einzige Anteil der ischiokruralen Gruppe ohne Hüftwirkung und der einzige mit abweichender Innervation."},{"lat":"M. semitendinosus","de":"halbsehniger Muskel","part":"Untere Extremität","lead":"Medialer Anteil der ischiokruralen Gruppe; beugt das Knie und dreht es nach innen.","kv":{"Regio":"Regio femoralis posterior, medialer Anteil; begrenzt die Fossa poplitea nach kraniomedial","Gruppe und Schicht":"Dorsale Oberschenkelloge (ischiokrurale Gruppe)","Innervation":"N. tibialis aus dem N. ischiadicus","Segment (Rückenmarkshöhe)":"L5–S2","Beteiligte Gelenke":"Hüftgelenk, Kniegelenk","Gliederung":"Einteilig, zweigelenkig"},"rows":[["Gesamter Muskel","Tuber ischiadicum, gemeinsam mit dem Caput longum des M. biceps femoris","Tibia medial, Pes anserinus superficialis","Extension der Hüfte, Flexion im Knie"],["Bei flektiertem Knie","Tuber ischiadicum","Tibia medial","Innenrotation des Unterschenkels"]],"sum":"Der Muskel beugt das Knie und dreht den Unterschenkel nach innen.","merk":"Semitendinosus bedeutet halbsehnig: die distale Muskelhälfte besteht aus Sehne, die in der Kniekehle tastbar ist."},{"lat":"M. semimembranosus","de":"plattsehniger Muskel","part":"Untere Extremität","lead":"Tiefster medialer Anteil der ischiokruralen Gruppe; sichert die mediale Kniekapsel.","kv":{"Regio":"Regio femoralis posterior, medialer Anteil, tiefe Schicht","Gruppe und Schicht":"Dorsale Oberschenkelloge (ischiokrurale Gruppe)","Innervation":"N. tibialis aus dem N. ischiadicus","Segment (Rückenmarkshöhe)":"L5–S2","Beteiligte Gelenke":"Hüftgelenk, Kniegelenk","Gliederung":"Einteilig, zweigelenkig, mit Kapselverbindung"},"rows":[["Gesamter Muskel","Tuber ischiadicum, breite platte Ursprungssehne","Condylus medialis tibiae, dorsomediale Gelenkkapsel","Extension der Hüfte, Flexion im Knie, Spannung der medialen Kapsel"],["Bei flektiertem Knie","Tuber ischiadicum","Condylus medialis tibiae","Innenrotation des Unterschenkels"]],"sum":"Der Muskel beugt das Knie und spannt dabei die Kapsel an der Knieinnenseite.","merk":"Semimembranosus bedeutet halbhäutig: der Ursprung ist eine breite Sehnenplatte, im Unterschied zum runden Strang des Semitendinosus."},{"lat":"M. popliteus","de":"Kniekehlenmuskel","part":"Untere Extremität","lead":"Kleiner Muskel im Grund der Kniekehle; entriegelt das gestreckte Knie.","kv":{"Regio":"Fossa poplitea (Kniekehle), Boden der Grube","Gruppe und Schicht":"Dorsale Unterschenkelloge, tiefe Schicht","Innervation":"N. tibialis","Segment (Rückenmarkshöhe)":"L4 bis S1","Beteiligte Gelenke":"Kniegelenk","Gliederung":"Einteilig; Ausstrahlung in den lateralen Meniskus und in die Kapsel"},"rows":[["Einteiliger Muskel","Epicondylus lateralis femoris, innerhalb der Gelenkkapsel","Facies posterior der Tibia, oberhalb der Linea musculi solei","Innenrotation des Unterschenkels gegen den Oberschenkel und damit Entriegelung des gestreckten Knies; geringe Beugung; zieht den lateralen Meniskus zurück"]],"sum":"Der kleine Muskel dreht den Unterschenkel nach innen und löst damit die Verriegelung des gestreckten Knies.","merk":"Poples ist lateinisch für Kniekehle. Und weil er von außen nach innen zieht, kann er den Unterschenkel nur nach innen drehen: Zugrichtung gleich Bewegungsrichtung."},{"lat":"M. triceps surae","de":"dreiköpfiger Wadenmuskel","part":"Untere Extremität","lead":"Stärkster Plantarflexor; bestimmt das Bewegungsausmaß der Dorsalextension.","kv":{"Regio":"Regio cruris posterior (Wade), oberflächliche Schicht","Gruppe und Schicht":"Dorsale Unterschenkelloge, oberflächliche Schicht","Innervation":"N. tibialis","Segment (Rüc
