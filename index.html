leibende aktive Streckung von Handgelenk und Fingergrundgelenken bei Schädigung des N. radialis"},{"cat":"Glossar","k":"Hypertonus, Muskelhartspann","v":"Dauerhaft erhöhte Ruhespannung eines Muskels, tastbar als derber Strang"},{"cat":"Glossar","k":"Hypomochlion","v":"Punkt, an dem eine Sehne umgelenkt wird und dadurch ihre Zugrichtung ändert"},{"cat":"Glossar","k":"Insertionstendopathie","v":"Reizzustand am knöchernen Sehnenansatz durch wiederholte Zugbelastung"},{"cat":"Glossar","k":"Intraabdomineller Druck","v":"Druck im Bauchraum, erzeugt von Zwerchfell, Bauchwand, tiefer Rückenmuskulatur und Beckenboden; stützt die Lendenwirbelsäule von innen"},{"cat":"Glossar","k":"Isometrische Arbeit","v":"Der Muskel entwickelt Spannung, ohne seine Länge zu ändern; er hält"},{"cat":"Glossar","k":"Kompartmentsyndrom","v":"Druckanstieg innerhalb einer Faszienloge mit Beeinträchtigung von Durchblutung und Nervenfunktion"},{"cat":"Glossar","k":"Konzentrische Arbeit","v":"Der Muskel entwickelt Spannung, während er sich verkürzt; er erzeugt die Bewegung"},{"cat":"Glossar","k":"Krallenhand","v":"Überstreckte Grundgelenke bei gebeugten Mittel- und Endgelenken; Folge des Ausfalls der kleinen Handmuskulatur"},{"cat":"Glossar","k":"Modiolus","v":"Muskulär-bindegewebiger Knotenpunkt seitlich des Mundwinkels, in dem die mimischen Muskeln zusammentreffen"},{"cat":"Glossar","k":"Nutation und Gegennutation","v":"Kippbewegung des Kreuzbeins gegenüber dem Darmbein im Iliosakralgelenk nach ventral beziehungsweise dorsal"},{"cat":"Glossar","k":"Parästhesie","v":"Missempfindung wie Kribbeln, Ameisenlaufen oder Taubheitsgefühl bei Nervenreizung"},{"cat":"Glossar","k":"Plexus","v":"Nervengeflecht, in dem Fasern mehrerer Segmente neu gebündelt werden; Plexus cervicalis, brachialis, lumbalis, sacralis"},{"cat":"Glossar","k":"Propriozeption","v":"Wahrnehmung von Stellung, Bewegung und Spannung des eigenen Körpers über Rezeptoren in Muskeln, Sehnen und Gelenken"},{"cat":"Glossar","k":"Scapula alata","v":"Flügelförmiges Abstehen des Schulterblatts bei Ausfall des M. serratus anterior"},{"cat":"Glossar","k":"Schlussrotation","v":"Außendrehung des Unterschenkels in den letzten Streckgraden, die das Kniegelenk verriegelt"},{"cat":"Glossar","k":"Schwurhand","v":"Unvollständiger Faustschluss mit gestrecktem Zeige- und Mittelfinger bei Schädigung des N. medianus"},{"cat":"Glossar","k":"Sesambein","v":"In eine Sehne eingelagerter Knochen; Patella, Os pisiforme, Sesambeine an Daumen und Großzehe"},{"cat":"Glossar","k":"Skapulohumeraler Rhythmus","v":"Verhältnis von Bewegung im Schultergelenk zu Drehung des Schulterblatts bei der Armhebung, etwa zwei zu eins"},{"cat":"Glossar","k":"Tendinopathie","v":"Degenerativer Umbau einer Sehne durch Überlastung, ohne entzündliches Geschehen im engeren Sinn"},{"cat":"Glossar","k":"Tendovaginitis","v":"Reizung oder Entzündung einer Sehnenscheide"},{"cat":"Glossar","k":"Tenodese-Effekt","v":"Ausführlich in Kapitel 1.9, Abschnitt Mehrgelenkige Muskeln"},{"cat":"Glossar","k":"Windenmechanismus","v":"Ausführlich in Kapitel 1.8, Abschnitt Aponeurosis plantaris"},{"cat":"Glossar","k":"Zuggurtung","v":"Prinzip, bei dem ein Zugelement die Biegebelastung eines Knochens aufnimmt; der Tractus iliotibialis entlastet so den Femurschaft"},{"cat":"Raum","k":"Trigonum submentale (Regio cervicalis anterior)","v":"Lateral der Venter anterior beider Mm. digastrici, kaudal das Corpus ossis hyoidei, kranial die Kinnspitze","x":"Boden: M. mylohyoideus. Inhalt: submentale Lymphknoten, V. jugularis anterior"},{"cat":"Raum","k":"Trigonum submandibulare (Regio cervicalis anterior)","v":"Kranial Basis mandibulae, ventral Venter anterior, dorsal Venter posterior des M. digastricus","x":"Boden: Mm. mylohyoideus und hyoglossus. Inhalt: Glandula submandibularis, N. hypoglossus, A. und V. facialis"},{"cat":"Raum","k":"Trigonum caroticum (Regio cervicalis anterior)","v":"Kranial Venter posterior des M. digastricus, ventrokaudal Venter superior des M. omohyoideus, dorsal Vorderrand des M. sternocleidomastoideus","x":"Boden: Mm. thyrohyoideus und hyoglossus, Pharynxwand. Inhalt: Karotisgabel, V. jugularis interna, N. vagus, Ansa cervicalis profunda"},{"cat":"Raum","k":"Trigonum musculare (omotracheale)","v":"Ventral die vordere Mittellinie, kraniolateral Venter superior des M. omohyoideus, kaudolateral Vorderrand des M. sternocleidomastoideus","x":"Boden: infrahyoidale Muskulatur. Inhalt: Schilddrüse, Larynx, Trachea, Ösophagus"},{"cat":"Raum","k":"Trigonum omoclaviculare (Fossa supraclavicularis major)","v":"Kaudal das mittlere Drittel der Clavicula, ventral Hinterrand des M. sternocleidomastoideus, kranial Venter inferior des M. omohyoideus","x":"Inhalt: A. und V. subclavia, Trunci des Plexus brachialis, supraklavikuläre Lymphknoten"},{"cat":"Raum","k":"Trigonum interscalenum (Skalenuslücke)","v":"Ventral M. scalenus anterior, dorsal M. scalenus medius, kaudal die erste Rippe","x":"Inhalt: A. subclavia und Plexus brachialis. Klinisch die Engstelle beim Skalenussyndrom"},{"cat":"Raum","k":"Trigonum scalenovertebrale","v":"Medial die Halswirbelsäule, lateral M. scalenus anterior, kaudal die Pleurakuppel und die A. subclavia","x":"Inhalt: Ganglion cervicothoracicum (stellatum), A. vertebralis, links zusätzlich der Ductus thoracicus"},{"cat":"Raum","k":"Trigonum suboccipitale (Trigonum arteriae vertebralis)","v":"Kraniomedial M. rectus capitis posterior major, kraniolateral M. obliquus capitis superior, kaudolateral M. obliquus capitis inferior","x":"Boden: Membrana atlantooccipitalis posterior und Arcus posterior atlantis. Inhalt: A. vertebralis, N. suboccipitalis (C1)"},{"cat":"Raum","k":"Trigonum auscultationis (Rücken)","v":"Kranial Unterrand des M. trapezius, lateral Margo medialis scapulae, kaudal Oberrand des M. latissimus dorsi","x":"Boden: sechste und siebte Rippe mit Interkostalraum. Dünnste Stelle der Rückenwand und damit Auskultationsfenster"},{"cat":"Raum","k":"Trigonum lumbale inferius (Petit, Rücken)","v":"Kaudal Crista iliaca, ventral Hinterrand des M. obliquus externus abdominis, dorsal Vorderrand des M. latissimus dorsi","x":"Boden: M. obliquus internus abdominis. Klinisch Bruchpforte der Hernia lumbalis inferior"},{"cat":"Raum","k":"Trigonum lumbale superius (Grynfeltt-Lesshaft, Rücken)","v":"Kranial 12. Rippe und M. serratus posterior inferior, medial M. quadratus lumborum und M. erector spinae, lateral M. obliquus internus abdominis","x":"Boden: Aponeurose des M. transversus abdominis. Bruchpforte der Hernia lumbalis superior"},{"cat":"Raum","k":"Trigonum clavipectorale (Mohrenheim-Grube)","v":"Kranial Clavicula, medial Pars clavicularis des M. pectoralis major, lateral M. deltoideus","x":"Inhalt: Durchtritt der V. cephalica in die V. axillaris, Rr. deltoidei der A. thoracoacromialis"},{"cat":"Raum","k":"Trigonum femorale (Scarpa)","v":"Kranial Lig. inguinale, lateral medialer Rand des M. sartorius, medial der Rand des M. adductor longus","x":"Boden: Fossa iliopectinea aus M. iliopsoas und M. pectineus. Inhalt: A. und V. femoralis, N. femoralis, tiefe inguinale Lymphknoten"},{"cat":"Raum","k":"Trigonum sternocostale (Larrey-Spalte, Diaphragma)","v":"Zwischen Pars sternalis und Pars costalis des Diaphragma","x":"Durchtritt: A. und V. epigastrica superior. Bruchpforte der Morgagni-Hernie"},{"cat":"Raum","k":"Trigonum lumbocostale (Bochdalek, Diaphragma)","v":"Zwischen Pars costalis und Pars lumbalis des Diaphragma","x":"Muskelfreie Stelle ohne regelhaften Durchtritt. Bruchpforte der Bochdalek-Hernie"},{"cat":"Raum","k":"Trigonum urogenitale und Trigonum anale (Perineum)","v":"Gemeinsame Grenze ist die Verbindungslinie beider Tubera ischiadica; ventral Symphyse und Rami inferiores ossis pubis, dorsal Os coccygis und Ligg. sacrotuberalia","x":"Urogenitale: Diaphragma urogenitale. Anale: Fossa ischioanalis mit M. levator ani und M. sphincter ani externus"},{"cat":"Raum","k":"Fossa axillaris (Achselhöhle)","v":"Ventral Plica axillaris anterior, dorsal Plica axillaris posterior, Leistenkanal)","v":"Vorderwand Aponeurose des M. obliquus externus, Dach Mm. obliquus internus und transversus, Boden Lig. inguinale, Hinterwand Fascia transversalis","x":"Funiculus spermaticus bzw. Lig. teres uteri, N. ilioinguinalis; Bruchpforte der Leistenhernie"},{"cat":"Raum","k":"Canalis adductorius (Adduktorenkanal)","v":"Lateral M. vastus medialis, medial Mm. adductor longus und magnus, Dach Membrana vastoadductoria","x":"A. und V. femoralis, N. saphenus; Austritt am Hiatus adductorius in die Fossa poplitea"},{"cat":"Raum","k":"Canalis carpi (Karpaltunnel)","v":"Boden und Seitenwände die Handwurzelknochen, Dach das Retinaculum musculorum flexorum","x":"N. medianus und die langen Fingerbeugersehnen; klinisch Karpaltunnelsyndrom"},{"cat":"Raum","k":"Canalis malleolaris (Tarsaltunnel)","v":"Zwischen Malleolus medialis und Tuber calcanei, Dach das Retinaculum musculorum flexorum","x":"M. tibialis posterior, M. flexor digitorum longus, A. und V. tibialis posterior, N. tibialis, M. flexor hallucis longus"},{"cat":"Raum","k":"Sulcus bicipitalis medialis (Innere Oberarmrinne)","v":"Zwischen M. biceps brachii und M. triceps brachii an der Innenseite des Oberarms","x":"A. brachialis, V. basilica, N. medianus, N. ulnaris"},{"cat":"Raum","k":"Sulcus nervi radialis (Radialisrinne am Humerus)","v":"Spiralig auf der Humerusrückfläche, überdeckt vom Caput laterale des M. triceps brachii","x":"N. radialis und A. profunda brachii; Schädigungsort bei Humerusschaftfraktur"},{"cat":"Raum","k":"Laterale Achsellücke (Durchtritt zum Schulterblatthals)","v":"Begrenzt von M. teres major, M. teres minor, Humerus und Caput longum des M. triceps brachii","x":"N. axillaris und A. circumflexa humeri posterior"},{"cat":"Raum","k":"Mediale Achsellücke (Durchtritt zur Skapula)","v":"Begrenzt von M. teres major, M. teres minor und Caput longum des M. triceps brachii","x":"A. circumflexa scapulae"},{"cat":"Raum","k":"Lacuna musculorum (Muskelpforte unter dem Leistenband)","v":"Lateraler Abschnitt unter dem Lig. inguinale, medial begrenzt vom Arcus iliopectineus, dorsal vom Os ilium","x":"M. iliopsoas, N. femoralis, N. cutaneus femoris lateralis"},{"cat":"Raum","k":"Lacuna vasorum (Gefäßpforte unter dem Leistenband)","v":"Medialer Abschnitt unter dem Lig. inguinale, lateral Arcus iliopectineus, medial Lig. lacunare, dorsal Os pubis","x":"A. und V. femoralis, R. femoralis des N. genitofemoralis; medial der Anulus femoralis als Bruchpforte"},{"cat":"Raum","k":"Foramen suprapiriforme (Öffnung oberhalb des M. piriformis)","v":"Zwischen Oberrand des M. piriformis und Incisura ischiadica major im Foramen ischiadicum majus","x":"A. und V. glutea superior, N. gluteus superior"},{"cat":"Raum","k":"Foramen infrapiriforme (Öffnung unterhalb des M. piriformis)","v":"Zwischen Unterrand des M. piriformis und Lig. sacrospinale","x":"N. ischiadicus, N. gluteus inferior, N. pudendus, A. und V. glutea inferior"},{"cat":"Raum","k":"Foramen ischiadicum minus (Kleine Sitzbeinöffnung)","v":"Kranial Lig. sacrospinale, kaudal Lig. sacrotuberale, ventral Incisura ischiadica minor","x":"M. obturatorius internus, N. pudendus, A. und V. pudenda interna"},{"cat":"Raum","k":"Hiatus saphenus (Öffnung in der Fascia lata)","v":"Im oberflächlichen Blatt der Fascia lata, begrenzt vom Margo falciformis","x":"Einmündung der V. saphena magna in die V. femoralis"},{"cat":"Gelenktyp","k":"Scharniergelenk","v":"1","x":"Humeroulnargelenk, oberes Sprunggelenk"},{"cat":"Gelenktyp","k":"Rad- oder Zapfengelenk","v":"1 (Rotation)","x":"Radioulnargelenke bei Pronation und Supination"},{"cat":"Gelenktyp","k":"Eigelenk","v":"2","x":"Proximales Handgelenk, obere Kopfgelenke"},{"cat":"Gelenktyp","k":"Sattelgelenk","v":"2","x":"Daumengrundgelenk"},{"cat":"Gelenktyp","k":"Kugelgelenk","v":"3","x":"Schultergelenk"},{"cat":"Gelenktyp","k":"Nussgelenk","v":"3, tief geführtes Kugelgelenk","x":"Hüftgelenk"},{"cat":"Gelenktyp","k":"Planes Gelenk","v":"geringe Gleitbewegung","x":"Wirbelgelenke, Costovertebralgelenke"},{"cat":"Faszienbauform","k":"Fascia superficialis","v":"Lockere Schicht zwischen Haut und Muskelfaszie, enthält Fettgewebe und Hautnerven — Verschieblichkeit der Haut, Wärmeisolation","x":"Subkutangewebe des Rumpfes, Camper- und Scarpa-Faszie der Bauchwand"},{"cat":"Faszienbauform","k":"Fascia profunda oder Muskelfaszie","v":"Straffe, faserreiche Hülle unmittelbar auf dem Muskel — Formgebung, Kraftübertragung, Begrenzung der Muskelquellung","x":"Fascia brachii, Fascia cruris"},{"cat":"Faszienbauform","k":"Septum intermusculare","v":"Einziehung der Muskelfaszie bis zum Knochen — Trennt benachbarte Logen, dient häufig als zusätzliche Ursprungsfläche","x":"Septum intermusculare brachii mediale und laterale"},{"cat":"Faszienbauform","k":"Aponeurose oder Sehnenplatte","v":"Flächige, sehnenartige Verbreiterung — Verteilt Zugkraft auf eine große Fläche statt auf einen Punkt","x":"Aponeurose des M. obliquus externus abdominis, Aponeurosis plantaris"},{"cat":"Faszienbauform","k":"Retinaculum","v":"Querverlaufendes, bandartig verstärktes Faszienband über Sehnen — Hält die Sehnen bei Gelenkbewegung am Knochen, verhindert das Abheben der Sehne","x":"Retinaculum musculorum flexorum der Hand, Retinacula des Sprunggelenks"},{"cat":"Faszie","k":"Fascia thoracolumbalis","v":"Bedeckt die autochthone Rückenmuskulatur, im Lendenbereich dreiblättrig. Ursprung von M. latissimus dorsi, M. transversus abdominis und M. obliquus internus; Ansatzgebiet des M. gluteus maximus","x":"Kraftverteiler des unteren Rückens und Träger der hinteren schrägen Kette; siehe ausführliche Darstellung unten"},{"cat":"Faszie","k":"Tractus iliotibialis","v":"Verdickter Längszug der Fascia lata von der Crista iliaca zum Tuberculum Gerdii; nimmt M. tensor fasciae latae und die oberflächlichen Anteile des M. gluteus maximus auf","x":"Zuggurtung des Femur; Ort des Tractus-iliotibialis-Syndroms; siehe ausführliche Darstellung unten"},{"cat":"Faszie","k":"Fascia lata","v":"Umschließt den Oberschenkel und schickt ","k":"Galea aponeurotica","v":"Sehnenhaube zwischen Venter frontalis und occipitalis des M. occipitofrontalis","x":"Überträgt Nackenspannung bis zur Stirn; erklärt einen Teil des Spannungskopfschmerzes"},{"cat":"Faszie","k":"Membrana interossea","v":"Zwischen den beiden Knochen von Unterarm und Unterschenkel","x":"Ursprungsfläche tiefer Muskeln, Druckübertragung zwischen den Knochen, Trennung ventraler und dorsaler Loge"},{"cat":"Faszie","k":"Lig. nuchae","v":"Sagittales Faszienseptum vom Hinterhaupt zum Dornfortsatz C7","x":"Ursprung von M. trapezius, M. splenius capitis und M. rhomboideus minor; Zugband des Kopfes, bei ventraler Kopfhaltung dauerhaft gespannt"},{"cat":"Region","k":"Regio frontalis","v":"Stirnregion","x":"Kranial Sutura coronalis, kaudal Margo supraorbitalis und Glabella, lateral Linea temporalis superior"},{"cat":"Region","k":"Regio parietalis","v":"Scheitelregion","x":"Ventral Sutura coronalis, dorsal Sutura lambdoidea, lateral Linea temporalis superior"},{"cat":"Region","k":"Regio occipitalis","v":"Hinterhauptregion","x":"Kranial Sutura lambdoidea, kaudal Linea nuchae superior, lateral die Regio mastoidea"},{"cat":"Region","k":"Regio temporalis","v":"Schläfenregion","x":"Kranial Linea temporalis superior, kaudal Arcus zygomaticus, ventral Margo posterior des Os zygomaticum, dorsal äußerer Gehörgang"},{"cat":"Region","k":"Regio orbitalis","v":"Augenregion","x":"Allseitig der knöcherne Orbitarand: Margo supraorbitalis, infraorbitalis, medialis und lateralis"},{"cat":"Region","k":"Regio nasalis","v":"Nasenregion","x":"Kranial Glabella und Nasenwurzel, kaudal Nasenboden mit Nasenflügeln, lateral der Sulcus nasolabialis"},{"cat":"Region","k":"Regio oralis","v":"Mundregion","x":"Kranial Nasenboden, kaudal Sulcus mentolabialis, lateral die Mundwinkel und der Sulcus nasolabialis"},{"cat":"Region","k":"Regio mentalis","v":"Kinnregion","x":"Kranial Sulcus mentolabialis, kaudal Basis mandibulae, lateral je eine Senkrechte durch den Mundwinkel"},{"cat":"Region","k":"Regio buccalis","v":"Wangenregion","x":"Ventral Sulcus nasolabialis, dorsal Vorderrand des M. masseter, kranial Arcus zygomaticus, kaudal Basis mandibulae"},{"cat":"Region","k":"Regio zygomatica","v":"Jochbeinregion","x":"Kranial Margo infraorbitalis, kaudal und dorsal Arcus zygomaticus, ventral die Regio buccalis"},{"cat":"Region","k":"Regio parotideomasseterica","v":"Ohrspeicheldrüsen- und Massetergegend","x":"Ventral Vorderrand des M. masseter, dorsal äußerer Gehörgang und Processus mastoideus, kranial Arcus zygomaticus, kaudal Angulus mandibulae"},{"cat":"Region","k":"Regio mastoidea","v":"Warzenfortsatzregion","x":"Um den Processus mastoideus, zwischen Ohrmuschel und Ansatz des M. sternocleidomastoideus"},{"cat":"Region","k":"Regio cervicalis anterior","v":"Vordere Halsregion","x":"Kranial Basis mandibulae, medial die vordere Mittellinie, lateral Vorderrand des M. sternocleidomastoideus, kaudal Incisura jugularis sterni"},{"cat":"Region","k":"Regio sternocleidomastoidea","v":"Region über dem Kopfwender","x":"Ventral und dorsal die beiden Ränder des M. sternocleidomastoideus, kranial Processus mastoideus, kaudal Sternum und Clavicula"},{"cat":"Region","k":"Regio cervicalis lateralis","v":"Seitliches Halsdreieck","x":"Ventral Hinterrand des M. sternocleidomastoideus, dorsal Vorderrand des M. trapezius, kaudal mittleres Drittel der Clavicula"},{"cat":"Region","k":"Regio cervicalis posterior","v":"Nackenregion, Regio nuchalis","x":"Kranial Linea nuchae superior und Protuberantia occipitalis externa, kaudal eine Horizontale durch den Dornfortsatz von C7, lateral Vorderrand des M. trapezius"},{"cat":"Raum","k":"Trigonum submentale","v":"Lateral die vorderen Bäuche beider Mm. digastrici, kaudal das Corpus des Os hyoideum, kranial die Kinnspitze","x":"Boden: M. mylohyoideus. Inhalt: submentale Lymphknoten, V. jugularis anterior"},{"cat":"Raum","k":"Trigonum submandibulare","v":"Kranial Basis mandibulae, ventral Venter anterior, dorsal Venter posterior des M. digastricus","x":"Boden: Mm. mylohyoideus und hyoglossus. Inhalt: Glandula submandibularis, N. hypoglossus, A. und V. facialis"},{"cat":"Raum","k":"Trigonum caroticum","v":"Kranial Venter posterior des M. digastricus, ventrokaudal Venter superior des M. omohyoideus, dorsal Vorderrand des M. sternocleidomastoideus","x":"Boden: Mm. thyrohyoideus und hyoglossus. Inhalt: Karotisgabel, V. jugularis interna, N. vagus, Ansa cervicalis"},{"cat":"Raum","k":"Trigonum musculare oder omotracheale","v":"Ventral die vordere Mittellinie, kraniolateral Venter superior des M. omohyoideus, kaudolateral Vorderrand des M. sternocleidomastoideus","x":"Boden: infrahyoidale Muskulatur. Inhalt: Schilddrüse, Larynx, Trachea, Ösophagus"},{"cat":"Raum","k":"Trigonum omoclaviculare, Fossa supraclavicularis major","v":"Kaudal das mittlere Drittel der Clavicula, ventral Hinterrand des M. sternocleidomastoideus, kranial Venter inferior des M. omohyoideus","x":"Inhalt: A. und V. subclavia, Trunci des Plexus brachialis, supraklavikuläre Lymphknoten"},{"cat":"Raum","k":"Hintere Skalenuslücke, Trigonum interscalenum","v":"Ventral M. scalenus anterior, dorsal M. scalenus medius, kaudal die erste Rippe","x":"Inhalt: A. subclavia und Plexus brachialis. Klinisch die Engstelle beim Skalenussyndrom"},{"cat":"Raum","k":"Vordere Skalenuslücke","v":"Ventral M. sternocleidomastoideus, dorsal M. scalenus anterior, kaudal die erste Rippe","x":"Inhalt: V. subclavia. Die Vene läuft damit vor dem Muskel, Arterie und Plexus dahinter"},{"cat":"Raum","k":"Trigonum scalenovertebrale","v":"Medial die Halswirbelsäule, lateral M. scalenus anterior, kaudal die Pleurakuppel","x":"Inhalt: Ganglion cervicothoracicum, A. vertebralis, links zusätzlich der Ductus thoracicus"},{"cat":"Raum","k":"Fossa retromandibularis","v":"Ventral Ramus mandibulae, dorsal Processus mastoideus und M. sternocleidomastoideus, medial Processus styloideus","x":"Inhalt: Glandula parotidea, N. facialis, V. retromandibularis, A. carotis externa"},{"cat":"Gelenk","k":"Oberes Kopfgelenk, Art. atlantooccipitalis","v":"Eigelenk","x":"Flexion und Extension, die Nickbewegung, etwa zwanzig Grad; geringe Lateralflexion","x2":"Kopf und Hals"},{"cat":"Gelenk","k":"Unteres Kopfgelenk, Art. atlantoaxialis","v":"Radgelenk mit drei Teilgelenken","x":"Rotation, etwa fünfundvierzig Grad je Seite; das ist die Hälfte der gesamten HWS-Rotation","x2":"Kopf und Hals"},{"cat":"Gelenk","k":"HWS-Segmente C2 bis C7","v":"Kombination aus Bandscheibe, Wirbelbogen- und Unkovertebralgelenken","x":"Flexion und Extension je etwa fünfundvierzig Grad, Lateralflexion und Rotation je Seite etwa fünfundvierzig Grad","x2":"Kopf und Hals"},{"cat":"Gelenk","k":"Kiefergelenk, Art. temporomandibularis","v":"Bikondyläres Gelenk mit Discus articularis","x":"Öffnen etwa fünfzig Millimeter Schneidekantenabstand, Protrusion und Retrusion, Mahlbewegung zur Seite","x2":"Kopf und Hals"},{"cat":"Gelenk","k":"Costotransversal- und Costovertebralgelenke der ersten Rippe","v":"Planes Gelenk","x":"Heben und Senken bei der Atmung; Angriffspunkt der Skalenusgruppe","x2":"Kopf und Hals"},{"cat":"Gelenk","k":"Aufhängung des Zungenbeins","v":"Kein echtes Gelenk, muskulär und bandhaft aufgehängt","x":"Verschiebung nach kranial, kaudal, ventral und dorsal beim Schlucken und Sprechen","x2":"Kopf und Hals"},{"cat":"Region","k":"Regio vertebralis","v":"Wirbelsäulenregion","x":"Median über den Dornfortsätzen, kranial Vertebra prominens C7, kaudal Os sacrum, seitlich etwa handbreit"},{"cat":"Region","k":"Regio scapularis","v":"Schulterblattregion","x":"Der knöcherne Umriss der Scapula: Margo medialis, Margo lateralis, Spina scapulae und Angulus inferior"},{"cat":"Region","k":"Regio interscapularis","v":"Region zwischen den Schulterblättern","x":"Lateral die Margines mediales scapulae, kranial Höhe Th1, kaudal Höhe des Angulus inferior scapulae, etwa Th7"},{"cat":"Region","k":"Regio infrascapularis","v":"Region unterhalb des Schulterblatts","x":"Kranial Angulus inferior scapula nk","x":"Durchtritt der Spinalnerven; Engstelle bei Bandscheibenvorfall und bei Arthrose der Wirbelbogengelenke"},{"cat":"Gelenk","k":"Bandscheibe, Symphysis intervertebralis","v":"Symphyse, unechtes Gelenk","x":"Druckverteilung und geringe Verformung in alle Richtungen; Summe über alle Segmente ergibt die Gesamtbeweglichkeit","x2":"Wirbelsäule und Rücken"},{"cat":"Gelenk","k":"Wirbelbogengelenke, Artt. zygapophysiales","v":"Planes Gelenk; Stellung der Gelenkflächen bestimmt die mögliche Richtung","x":"HWS schräg gestellt: viel Rotation. BWS frontal gestellt: Rotation möglich, Flexion gering. LWS sagittal gestellt: Flexion und Extension, kaum Rotation","x2":"Wirbelsäule und Rücken"},{"cat":"Gelenk","k":"BWS-Segmente","v":"Kombinationsgelenke mit Rippenanbindung","x":"Rotation etwa dreißig Grad je Seite, Extension gering; die Rippen begrenzen die Beweglichkeit","x2":"Wirbelsäule und Rücken"},{"cat":"Gelenk","k":"LWS-Segmente","v":"Kombinationsgelenke","x":"Flexion etwa fünfzig Grad, Extension etwa zwanzig Grad, Lateralflexion je zwanzig Grad, Rotation nur etwa fünf Grad je Seite","x2":"Wirbelsäule und Rücken"},{"cat":"Gelenk","k":"Iliosakralgelenk","v":"Amphiarthrose mit straffem Bandapparat","x":"Nutation und Gegennutation von wenigen Grad; kraftschlüssig durch die Form der Gelenkflächen gesichert","x2":"Wirbelsäule und Rücken"},{"cat":"Gelenk","k":"Kostovertebralgelenke","v":"Zwei Teilgelenke je Rippe","x":"Drehung der Rippe um ihre Längsachse; steuert Hebung und Senkung des Thorax","x2":"Wirbelsäule und Rücken"},{"cat":"Region","k":"Regio praesternalis","v":"Region über dem Brustbein","x":"Kranial Incisura jugularis, kaudal Processus xiphoideus, lateral die Sternumränder"},{"cat":"Region","k":"Regio pectoralis","v":"Brustregion","x":"Kranial Clavicula, kaudal sechste bis siebte Rippe, medial Sternumrand, lateral vordere Axillarlinie"},{"cat":"Region","k":"Regio inframammaria","v":"Region unter der Brust","x":"Kranial die Submammarfalte, kaudal Rippenbogen"},{"cat" s anterior, M. subclavius, M. pectoralis minor","m":[41,23,39,40,20]},{"n":"Thenarmuskulatur","reg":"Hand","b":"Daumenballen; intrinsische Muskeln des Daumens","t":"Mm. abductor pollicis brevis, flexor pollicis brevis, opponens pollicis, adductor pollicis","m":[]},{"n":"Hypothenarmuskulatur","reg":"Hand","b":"Kleinfingerballen","t":"Mm. abductor digiti minimi, flexor digiti minimi brevis, opponens digiti minimi, palmaris brevis","m":[]},{"n":"Radiale Gruppe des Unterarms","reg":"Unterarm","b":"Muskeln der radialen Unterarmkante; N. radialis","t":"M. brachioradialis, Mm. extensor carpi radialis longus et brevis","m":[64]},{"n":"Bauchwandmuskulatur","reg":"Rumpf","b":"Gerade, schräge und quere Bauchmuskeln; bilden die Rektusscheide","t":"M. rectus abdominis, M. pyramidalis, Mm. obliquus externus et internus abdominis, M. transversus abdominis","m":[49,45,46]},{"n":"Atemmuskulatur","reg":"Rumpf","b":"Inspiratorisch, exspiratorisch und Hilfsmuskulatur","t":"Inspiratorisch: Diaphragma, Mm. intercostales externi, Mm. levatores costarum. Exspiratorisch: Mm. intercostales interni, Bauchmuskulatur. Hilfsmuskeln: Mm. scaleni, M. sternocleidomastoideus, Mm. pectorales, M. serratus anterior, M. latissimus dorsi","m":[10,32,41,21,42,19,44]},{"n":"Beckenboden","reg":"Becken","b":"Zwei übereinanderliegende Platten: Diaphragma pelvis und Diaphragma urogenitale","t":"Diaphragma pelvis: M. levator ani mit Mm. pubococcygeus, iliococcygeus und puborectalis sowie M. coccygeus. Diaphragma urogenitale: M. transversus perinei profundus und superficialis","m":[51]},{"n":"Innere Hüftmuskulatur","reg":"Hüfte","b":"Muskeln mit Ursprung im Becken, Durchtritt zum Femur","t":"M. iliopsoas mit M. psoas major und M. iliacus, M. piriformis","m":[86,81]},{"n":"Äußere Hüftmuskulatur","reg":"Hüfte","b":"Muskeln der Gesäßregion und des Trochanter major","t":"Mm. glutei maximus, medius et minimus, M. tensor fasciae latae sowie die pelvitrochantäre Gruppe","m":[85]},{"n":"Pelvitrochantäre Muskulatur","reg":"Hüfte","b":"Tiefe Außenrotatoren zwischen Becken und Trochanter major","t":"M. piriformis, M. obturatorius internus et externus, Mm. gemelli superior et inferior, M. quadratus femoris","m":[86]},{"n":"Ischiokrurale Muskulatur","reg":"Oberschenkel","b":"Muskeln von Sitzbein (Ischium) zum Unterschenkel (Crus); im Englischen Hamstrings. Zweigelenkig: strecken die Hüfte und beugen das Knie","t":"M. biceps femoris, M. semitendinosus, M. semimembranosus","m":[98,96,97]},{"n":"M. quadriceps femoris","reg":"Oberschenkel","b":"Vierköpfiger Kniestrecker; nur der M. rectus femoris ist zweigelenkig","t":"M. rectus femoris, Mm. vastus medialis, lateralis et intermedius","m":[]},{"n":"Adduktorengruppe","reg":"Oberschenkel","b":"Mediale Oberschenkelloge; N. obturatorius","t":"Mm. adductor longus, brevis et magnus, M. gracilis, M. pectineus","m":[91,95]},{"n":"Pes anserinus superficialis","reg":"Knie","b":"Gänsefuß: gemeinsame Ansatzregion medial am Tibiakopf","t":"M. sartorius, M. gracilis, M. semitendinosus","m":[97,89,95]},{"n":"Pes anserinus profundus","reg":"Knie","b":"Tiefer Gänsefuß am Condylus medialis tibiae","t":"M. semimembranosus mit seinen Ausstrahlungen in Kapsel und Faszie","m":[98]},{"n":"M. triceps surae","reg":"Unterschenkel","b":"Dreiköpfige Wadenmuskulatur mit gemeinsamer Achillessehne","t":"M. gastrocnemius mit Caput mediale und laterale, M. soleus","m":[]},{"n":"Peroneus- oder Fibularisgruppe","reg":"Unterschenkel","b":"Laterale Unterschenkelloge; N. peroneus superficialis","t":"Mm. peroneus longus et brevis. Der M. peroneus tertius zählt zur Extensorenloge","m":[]},{"n":"Tiefe Flexorenloge des Unterschenkels","reg":"Unterschenkel","b":"Dorsale tiefe Schicht; N. tibialis","t":"M. tibialis posterior, M. flexor digitorum longus, M. flexor hallucis longus, M. popliteus","m":[102,99]},{"n":"Intrinsische Fußmuskulatur","reg":"Fuß","b":"Ursprung und Ansatz innerhalb des Fußes; verspannt die Gewölbe","t":"M. flexor digitorum brevis, M. abductor hallucis, M. abductor digiti minimi, M. quadratus plantae, Mm. interossei, Mm. lumbricales","m":[]},{"n":"Extrinsische Fußmuskulatur","reg":"Fuß","b":"Ursprung am Unterschenkel, Ansatz am Fuß","t":"M. tibialis anterior et posterior, Mm. peronei, M. triceps surae, lange Zehenbeuger und -strecker","m":[104,100]}],"trakte":[{"n":"Sakrospinales System, longitudinal","t":"M. iliocostalis mit Pars lumborum, thoracis und cervicis. M. longissimus mit Pars thoracis, cervicis und capitis","v":"Vom Os sacrum, der Crista iliaca und der Fascia thoracolumbalis längs nach kranial zu Rippen, Querfortsätzen und Processus mastoideus","f":"Beidseitig Extension der gesamten Wirbelsäule, einseitig Lateralflexion und geringe Rotation zur gleichen Seite. Das ist der Muskelwulst, der beidseits der Dornfortsätze tastbar ist. Bei lumbaler Überlastung typischerweise hyperton","m":[26,27]},{"n":"Spinotransversales System, schräg","t":"M. splenius capitis, M. splenius cervicis","v":"Von den Dornfortsätzen C3 bis Th3 und dem Lig. nuchae schräg nach kraniolateral zu Processus mastoideus und Querfortsätzen C1 bis C3","f":"Beidseitig Extension der HWS, einseitig Rotation und Lateralflexion zur gleichen Seite. Antagonist zum M. sternocleidomastoideus, der zur Gegenseite dreht","m":[30,29]},{"n":"Intertransversales System, quer","t":"Mm. intertransversarii mediales und laterales lumborum, Mm. intertransversarii posteriores cervicis, Mm. levatores costarum","v":"Von Querfortsatz zu Querfortsatz über ein Segment; die Levatores costarum vom Querfortsatz schräg abwärts zur nächsten Rippe","f":"Segmentale Sicherung bei Lateralflexion, Rippenhebung bei der Einatmung. Diese Muskeln arbeiten kaum als Beweger, sondern liefern dem Nervensystem Stellungsinformation","m":[31,32]},{"n":"Spinales oder interspinales System, longitudinal","t":"M. spinalis mit Pars thoracis, cervicis und capitis. Mm. interspinales cervicis und lumborum","v":"Von Dornfortsatz zu Dornfortsatz, längs unmittelbar neben der Mittellinie","f":"Extension der Wirbelsäule aus nächster Nähe zur Drehachse. Die Mm. interspinales verbinden jeweils zwei benachbarte Dornfortsätze und sind fast reine Stellungsfühler","m":[33,28]},{"n":"Transversospinales System, schräg","t":"M. semispinalis mit Pars thoracis, cervicis und capitis, überspringt vier bis sechs Segmente. M. multifidus, überspringt zwei bis vier Segmente. Mm. rotatores breves und longi, überspringen null bis ein Segment","v":"Vom Querfortsatz schräg nach kraniomedial zum Dornfortsatz weiter oben gelegener Wirbel","f":"Beidseitig Extension, einseitig Rotation zur Gegenseite. Je kürzer der Muskel, desto mehr Stabilisator und desto weniger Beweger. Der M. multifidus ist im Lendenbereich am kräftigsten ausgebildet und atrophiert nach Rückenschmerzepisoden nachweislich segmental","m":[35]},{"n":"Tiefste Schicht, den Trakten vorgelagert","t":"Mm. suboccipitales: Mm. rectus capitis posterior major et minor, Mm. obliquus capitis superior et inferior","v":"Zwischen Os occipitale, Atlas und Axis, also nur über die beiden Kopfgelenke","f":"Feinsteuerung der Kopfstellung. Die höchste Dichte an Muskelspindeln des gesamten Körpers; funktionell ein Gleichgewichtsorgan und nicht in erster Linie ein Beweger","m":[37]}]}</script>
<script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById('data').textContent);
var CARDS=D.cards, BEG=D.begriffe;
var REGIONS=[], BCATS=[];
CARDS.forEach(function(c,i){ c.i=i; if(REGIONS.indexOf(c.part)<0) REGIONS.push(c.part); });
var BORDER=['Richtung','Bewegung','Adjektiv','Struktur','Knochenpunkt','Gelenk','Glossar','Abkürzung','Region','Raum','Faszie','Gelenktyp','Faszienbauform'];
BEG.forEach(function(b,i){ b.i=i; if(BCATS.indexOf(b.cat)<0) BCATS.push(b.cat); });
BCATS.sort(function(a,b){ return BORDER.indexOf(a)-BORDER.indexOf(b); });
var XLBL={Richtung:['Abkürzung','Beispiel'],Bewegung:['Gegenbewegung','Beispiel'],
  Adjektiv:['Was daraus folgt','Beispiel'],Struktur:['Beispiele','Wo er vorkommt'],
  Gelenk:['Bewegungen','Körperabschnitt'],Region:['Begrenzungen',''],Raum:['Boden und Inhalt',''],Faszie:['Klinische Bedeutung',''],
  'Abkürzung':['Beispiel',''],Gelenktyp:['Beispiel',''],Faszienbauform:['Beispiel','']};

/* ---------- storage ---------- */
var KEY='muskeltrainer.v2';
var S={box:{},err:{},sel:{},right:0,wrong:0,region:'Alle',bcat:'Alle',deck:'muskeln',qscope:'mix',qtype:'alles',
       goal:20,day:'',today:0,streak:0,lastDone:''};
try{var raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function dstr(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function today(){ return dstr(new Date()); }
function yesterday(){ var d=new Date(); d.setDate(d.getDate()-1); return dstr(d); }
function tickDay(){
  var t=today();
  if(S.day!==t){ S.day=t; S.today=0; }
  S.today++;
  if(S.today===S.goal){ S.streak = (S.lastDone===yesterday()? S.streak+1 : 1); S.lastDone=t; }
}
function lvl(k){ return S.box[k]||1; }
function grade(k,ok){
  S.box[k]= ok? Math.min(5,lvl(k)+1) : 1;
  if(ok) delete S.err[k]; else S.err[k]=1;
  tickDay(); save();
}
function errCount(){ var n=0; for(var k in S.err) n++; return n; }
function selOn(k){ return !!S.sel[k]; }
function selToggle(k){ if(S.sel[k]) delete S.sel[k]; else S.sel[k]=1; save(); }
function selCount(pre){ var n=0; for(var k in S.sel){ if(!pre||k.charAt(0)===pre) n++; } return n; }
function selAdd(keys){ keys.forEach(function(k){ S.sel[k]=1; }); save(); }
function selMuscles(){ return CARDS.filter(function(c){return S.sel['m'+c.i];}); }
function selBegriffe(){ return BEG.filter(function(b){return S.sel['b'+b.i];}); }

/* ---------- helpers ---------- */
var $=function(s,r){return (r||document).querySelector(s);};
function top0(){ try{ window.scrollTo(0,0); }catch(e){}
  try{ document.documentElement.scrollTop=0; document.body.scrollTop=0; }catch(e){} }
function el(t,c,x){var n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function trim(s,n){s=String(s||''); return s.length>n? s.slice(0,n-1).replace(/[\s,;·]+$/,'')+'…':s;}
function esc(s){var d=document.createElement('div'); d.textContent=s; return d.innerHTML;}
function norm(s){return String(s||'').toLowerCase()
  .replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss');}
function pick(a){return a[Math.floor(Math.random()*a.length)];}

/* ---------- state ---------- */
var tab='karten', deck=S.deck||'muskeln';
var queue=[], cur=null, flipped=false;
var qscope=S.qscope||'mix', qtype=S.qtype||'alles', q=null, answered=false;
var exam=null;
var wpath=[];     /* Wissen: breadcrumb stack */
var wquery='';

/* ---------- pools ---------- */
function mpool(){
  if(S.region==='Fehler') return CARDS.filter(function(c){return S.err['m'+c.i];});
  if(S.region==='Auswahl') return selMuscles();
  return S.region==='Alle'?CARDS:CARDS.filter(function(c){return c.part===S.region;});
}
function bpool(){
  if(S.bcat==='Fehler') return BEG.filter(function(b){return S.err['b'+b.i];});
  if(S.bcat==='Auswahl') return selBegriffe();
  return S.bcat==='Alle'?BEG:BEG.filter(function(b){return b.cat===S.bcat;});
}
function pool(){ return deck==='muskeln'? mpool() : bpool(); }
function pre(){ return deck==='muskeln'?'m':'b'; }

function buildQueue(){
  var p=pool().slice(), pr=pre();
  p.sort(function(a,b){var d=lvl(pr+a.i)-lvl(pr+b.i); return d!==0?d:Math.random()-0.5;});
  queue=shuffle(p.slice(0,Math.min(12,p.length))).concat(p.slice(12));
  cur=queue.length?queue[0]:null; flipped=false;
}

/* ---------- card renderers ---------- */
function factRow(dl,k,v,mono){
  if(!v) return;
  var d=el('div','fact'); d.appendChild(el('dt',null,k));
  d.appendChild(el('dd',mono?'mono':null,v)); dl.appendChild(d);
}
function muscleBack(c,onMuscle){
  var card=el('div','card');
  var h=el('div','cardhead');
  h.appendChild(el('div','eyebrow',c.part));
  h.appendChild(el('div','lat',c.lat));
  if(c.de) h.appendChild(el('div','de',c.de));
  card.appendChild(h);
  var dl=el('dl','facts');
  factRow(dl,'Innervation',c.kv['Innervation']);
  factRow(dl,'Segment',c.kv['Segment (Rückenmarkshöhe)'],true);
  factRow(dl,'Gelenke',c.kv['Beteiligte Gelenke']);
  factRow(dl,'Gruppe',c.kv['Gruppe und Schicht']);
  factRow(dl,'Regio',c.kv['Regio']);
  card.appendChild(dl);
  if(c.rows&&c.rows.length){
    var u=el('div','uaf'); u.appendChild(el('h4','','Ursprung · Ansatz · Funktion'));
    c.rows.forEach(function(r){
      var p=el('div','part');
      if(r[0]) p.appendChild(el('div','pname',r[0]));
      [['Ursprung',r[1]],['Ansatz',r[2]],['Funktion',r[3]]].forEach(function(pr){
        if(!pr[1]) return;
        var row=el('div','row'); row.appendChild(el('b',null,pr[0]));
        row.appendChild(el('span',null,pr[1])); p.appendChild(row);
      });
      u.appendChild(p);
    });
    card.appendChild(u);
  }
  var fg=D.funk.filter(function(g){return g.m.some(function(x){return x.i===c.i;});});
  if(fg.length){
    var w=el('div','mlist');
    fg.forEach(function(g){
      var b=el('button','mchip'); b.type='button';
      b.appendChild(document.createTextNode(g.g+' · '+g.b));
      b.onclick=function(){ goWissen({k:'fg',o:g}); };
      w.appendChild(b);
    });
    card.appendChild(w);
  }
  card.appendChild(starRow('m'+c.i));
  if(c.sum){var b=el('div','box sum'); b.appendChild(el('h4','','Zusammenfassung')); b.appendChild(el('div',null,c.sum)); card.appendChild(b);}
  if(c.merk){var m=el('div','box merk'); m.appendChild(el('h4','','Merkhilfe')); m.appendChild(el('div',null,c.merk)); card.appendChild(m);}
  return card;
}
function starRow(k,extra){
  var w=el('div','starrow');
  var b=el('button','star'); b.type='button';
  function paint(){
    b.textContent = selOn(k)?'★  In meiner Auswahl':'☆  Zur Auswahl';
    b.setAttribute('aria-pressed',String(selOn(k)));
  }
  b.onclick=function(){ selToggle(k); paint(); updateCount(); };
  paint(); w.appendChild(b);
  if(extra) w.appendChild(extra);
  return w;
}
function begriffBack(b){
  var card=el('div','card');
  var h=el('div','cardhead');
  h.appendChild(el('div','eyebrow',b.cat));
  h.appendChild(el('div','lat sm',b.k));
  card.appendChild(h);
  var dl=el('dl','facts');
  factRow(dl,'Bedeutung',b.v);
  var L=XLBL[b.cat]||['Dazu','Mehr'];
  factRow(dl,L[0]||'Dazu',b.x);
  factRow(dl,L[1]||'Mehr',b.x2);
  card.appendChild(dl);
  card.appendChild(starRow('b'+b.i));
  return card;
}

/* ---------- Karten ---------- */
function renderSubKarten(){
  var s=$('#subbar'); s.textContent='';
  var seg=el('div','seg');
  [['muskeln','Muskeln'],['begriffe','Begriffe']].forEach(function(d){
    var b=el('button',null,d[1]); b.type='button';
    b.setAttribute('aria-pressed',String(deck===d[0]));
    b.onclick=function(){ deck=d[0]; S.deck=d[0]; save(); buildQueue(); render(); };
    seg.appendChild(b);
  });
  s.appendChild(seg);
  var c=el('div','chips');
  var opts = deck==='muskeln'? ['Alle'].concat(REGIONS) : ['Alle'].concat(BCATS);
  var pr = deck==='muskeln'?'m':'b';
  if(selCount(pr)) opts.splice(1,0,'Auswahl');
  if(errCount()) opts.push('Fehler');
  var key = deck==='muskeln'?'region':'bcat';
  opts.forEach(function(r){
    var b=el('button','chip'); b.type='button';
    b.appendChild(document.createTextNode(r==='Fehler'?'Fehlerkiste':(r==='Auswahl'?'Meine Auswahl':r)));
    if(r==='Fehler') b.appendChild(el('span','n',String(errCount())));
    if(r==='Auswahl') b.appendChild(el('span','n',String(selCount(pr))));
    b.setAttribute('aria-pressed',String(S[key]===r));
    b.onclick=function(){ S[key]=r; save(); buildQueue(); render(); };
    c.appendChild(b);
  });
  s.appendChild(c);
}
function renderKarten(){
  var main=$('#main'), bar=$('#bar');
  main.textContent=''; bar.textContent='';
  var pane=el('div','pane'); main.appendChild(pane);
  if(!cur){
    pane.appendChild(emptyBox(S.region==='Fehler'||S.bcat==='Fehler'?'Die Fehlerkiste ist leer.':'Nichts in dieser Auswahl.',
      'Wähle oben eine andere Gruppe.'));
    return;
  }
  var k=pre()+cur.i;
  if(!flipped){
    var card=el('div','card front'), h=el('div','cardhead');
    if(deck==='muskeln'){
      h.appendChild(el('div','eyebrow',cur.part+' · Stufe '+lvl(k)+'/5'));
      h.appendChild(el('div','lat',cur.lat));
      if(cur.de) h.appendChild(el('div','de',cur.de));
      if(cur.lead) h.appendChild(el('p','lead',cur.lead));
      h.appendChild(el('p','hint','Überlege Ursprung, Ansatz, Funktion und Innervation — dann aufdecken.'));
    }else{
      h.appendChild(el('div','eyebrow',cur.cat+' · Stufe '+lvl(k)+'/5'));
      h.appendChild(el('div','lat sm',cur.k));
      h.appendChild(el('p','hint','Was bedeutet der Begriff?'));
    }
    card.appendChild(h); pane.appendChild(card);

function qMuskel(){
  var p=mpoolAll(); if(!p.length) return null;
  for(var n=0;n<50;n++){
    var t=pick(MT), c=pick(p), r=c.rows.length?pick(c.rows):null;
    var right=t.v(c,r);
    if(!right) continue;
    if(t.req&&!t.req(c)) continue;
    var src=t.from?t.from():shuffle(CARDS.filter(function(x){return x.part===c.part&&x!==c;}))
      .concat(shuffle(CARDS.slice()))
      .map(function(x){ return t.v(x,row0(x)); });
    var o=distinct(src,right,3); if(!o) continue;
    return {l:t.l,a:t.a(c,r),right:right,opts:shuffle(o.concat([right])),max:t.max,card:c};
  }
  return null;
}
function qErraten(){
  var p=mpoolAll(); if(!p.length) return null;
  for(var n=0;n<50;n++){
    var t=pick(ET), c=pick(p), r=c.rows.length?pick(c.rows):null;
    var txt=t.p(c,r);
    if(!txt) continue;
    var others=shuffle(CARDS.filter(function(x){return x.part===c.part&&x!==c;}))
      .concat(shuffle(CARDS.filter(function(x){return x!==c;}))).map(function(x){return x.lat;});
    var o=distinct(others,c.lat,3); if(!o) continue;
    return {l:t.l,a:t.a(txt,c,r),right:c.lat,opts:shuffle(o.concat([c.lat])),max:70,card:c};
  }
  return null;
}
function qFunktion(){

  if(!gs.length) return null;
  for(var n=0;n<50;n++){
    var g=pick(gs);
    var inPool=g.m.filter(function(x){return ids[x.i];});
    if(!inPool.length) continue;
    if(Math.random()<0.5){
      var c=CARDS[pick(inPool).i];
      var inG={}; g.m.forEach(function(x){inG[x.i]=1;});
      var others=shuffle(CARDS.filter(function(x){return !inG[x.i]&&x.part===c.part;}))
        .concat(shuffle(CARDS.filter(function(x){return !inG[x.i];})))
        .map(function(x){return x.lat;});
      var o=distinct(others,c.lat,3); if(!o) continue;
      return {l:'Funktionsgruppe',a:'Welcher Muskel leistet <em>'+esc(g.b)+'</em> im Bereich <em>'+esc(g.g)+'</em>?',
              right:c.lat,opts:shuffle(o.concat([c.lat])),max:70,card:c,grp:g};
    }else{
      var c2=CARDS[pick(inPool).i];

        if(x.g===g.g && x.m.some(function(y){return y.i===c2.i;})) bad[x.b]=1;
      });
      var others2=D.funk.filter(function(x){return x.g===g.g;}).map(function(x){return x.b;})
        .concat(shuffle(D.funk.slice()).map(function(x){return x.b;}))
        .filter(function(bb){return !bad[bb];});
      var o2=distinct(others2,g.b,3); if(!o2) continue;

function qBegriff(){

function distinct(src,right,n){
  var seen={},out=[]; seen[norm(right)]=1;
  for(var i=0;i<src.length&&out.length<n;i++){
    var v=src[i]; if(!v) continue;
    var k=norm(v); if(seen[k]) continue;
    seen[k]=1; out.push(v);
  }
  return out.length===n?out:null;
}

function startExam(){
  var qs=[],seen={},guard=0;
  while(qs.length<20&&guard++<300){
    var saved=q; q=null; newQuestion();
    if(q&&!seen[q.a]){ seen[q.a]=1; qs.push(q); }
    q=saved;
  }
  if(qs.length<4){ return; }
  exam={qs:qs,i:0,ans:[]}; q=null; render(); top0();
}

  inp.oninput=function(){
    wquery=inp.value;
    if(wquery.trim().length>=2 && wpath.length){ wpath=[]; render(); $('#q-search').focus(); return; }
    renderResults(res); if(deep) deep.hidden = !!wquery.trim();
  };
  pane.appendChild(inp);
  var res=el('div'); pane.appendChild(res);
  renderResults(res);
  var deep=null;
  if(wpath.length){
    deep=el('div','pane');
    var cr=el('div','crumb');
    var back=el('button',null,'‹ Zurück'); back.type='button';
    back.onclick=function(){ wpath.pop(); render(); };
    cr.appendChild(back);
    deep.appendChild(cr);
    deep.appendChild(detailOf(wpath[wpath.length-1]));
    deep.hidden = !!wquery.trim();
    pane.appendChild(deep);
    return;
  }
  if(!wquery.trim()){
    pane.appendChild(el('h3','sec','Nachschlagen'));
    var l=el('div','list');
    AREAS.forEach(function(a){
      var b=el('button','li'); b.type='button';
      b.appendChild(el('div','t',a.t)); b.appendChild(el('div','s',a.s));
      b.onclick=function(){ wpath.push({k:'area',o:a}); render(); top0(); };
      l.appendChild(b);
    });
    pane.appendChild(l);
  }
}
function renderResults(host){
  host.textContent='';
  var t=norm(wquery.trim());
  if(t.length<2) return;
  var hits=searchIndex().filter(function(x){return x.n.indexOf(t)>=0;});
  hits.sort(function(a,b){ return norm(a.t).indexOf(t)-norm(b.t).indexOf(t); });
  if(!hits.length){ host.appendChild(emptyBox('Nichts gefunden.','Versuche einen anderen Begriff.')); return; }
  var l=el('div','list');
  hits.slice(0,60).forEach(function(x){ l.appendChild(listRow(x)); });
  host.appendChild(l);
}
function mChips(list){
  var w=el('div','mlist');
  list.forEach(function(x){
    var c=CARDS[x.i!==undefined?x.i:x];
    if(!c) return;
    var b=el('button','mchip'); b.type='button';
    b.appendChild(document.createTextNode(c.lat));
    if(x.h) b.appendChild(el('small',null,x.h));
    b.onclick=function(){ wpath.push({k:'m',o:c}); render(); top0(); };
    w.appendChild(b);
  });
  return w;
}
function simple(eyebrow,title,rows,muscles){
  var card=el('div','card'), h=el('div','cardhead');
  h.appendChild(el('div','eyebrow',eyebrow));
  h.appendChild(el('div','lat sm',title));
  card.appendChild(h);
  var dl=el('dl','facts');
  rows.forEach(function(r){ factRow(dl,r[0],r[1],r[2]); });
  if(dl.children.length) card.appendChild(dl);
  if(muscles&&muscles.length){
    card.appendChild(mChips(muscles));
    var keys=muscles.map(function(x){return 'm'+(x.i!==undefined?x.i:x);});
    card.appendChild(starRowBulk(keys));
  }
  return card;
}
function starRowBulk(keys){
  var w=el('div','starrow');
  var b=el('button','star'); b.type='button';
  function paint(){
    var have=keys.filter(selOn).length;
    b.textContent = have===keys.length ? ('★  alle '+keys.length+' in meiner Auswahl')
                                       : ('☆  alle '+keys.length+' zur Auswahl');
    b.setAttribute('aria-pressed',String(have===keys.length));
  }
  b.onclick=function(){
    var have=keys.filter(selOn).length;
    if(have===keys.length){ keys.forEach(function(k){ delete S.sel[k]; }); save(); }
    else selAdd(keys);
    paint(); updateCount();
  };
  paint(); w.appendChild(b); return w;
}
function detailOf(it){
  var o=it.o;
  if(it.k==='m') return muscleBack(o);
  if(it.k==='b') return begriffBack(o);
  if(it.k==='ge') return simple('Gelenk',o.n,[['Gelenktyp',o.t],['Bewegungen',o.b],['Abschnitt',o.reg]],null);
  if(it.k==='fa') return simple('Faszie',o.n,[['Lage und Muskeln',o.l],['Klinisch',o.k]],null);
  if(it.k==='ra') return simple('Raum',o.n,[['Begrenzungen',o.b],['Boden und Inhalt',o.i],['Abschnitt',o.reg]],null);
  if(it.k==='fg') return simple('Funktionsgruppe',o.g+' · '+o.b,[],o.m);
  if(it.k==='gr') return simple('Gruppe'+(o.reg?' · '+o.reg:''),o.n,[['Muskeln',o.t],['Kennzeichen',o.k]],o.m);
  if(it.k==='sa') return simple('Sammelbegriff'+(o.reg?' · '+o.reg:''),o.n,[['Bedeutung',o.b],['Muskeln',o.t]],o.m);
  if(it.k==='tr') return simple('Trakt und System',o.n,[['Muskeln',o.t],['Verlauf',o.v],['Funktion',o.f]],o.m);
  if(it.k==='ke') return simple('Kennmuskel',o.s,[['Muskel',o.n],['Geprüfte Funktion',o.f]],o.m);
  if(it.k==='dy') return simple('Dysbalance',o.n,[['Verkürzt',o.v],['Abgeschwächt',o.a],['Folge',o.f]],o.m);
  if(it.k==='me') return simple('Mehrgelenkiger Muskel',o.n,[['Überquerte Gelenke',o.g],['Folge',o.f]],o.m);
  if(it.k==='area') return areaList(o);
  return el('div');
}
function bulkRow(keys){
  var w=el('div','bulk');
  var have=keys.filter(selOn).length;
  var add=el('button','bulkbtn'); add.type='button';
  add.textContent = have===keys.length ? ('alle '+keys.length+' ausgewählt') : ('+  alle '+keys.length+' auswählen');
  add.disabled = have===keys.length;
  add.onclick=function(){ selAdd(keys); render(); };
  w.appendChild(add);
  if(have){
    var rm=el('button','bulkbtn rm'); rm.type='button';
    rm.textContent='−  Auswahl aufheben ('+have+')';
    rm.onclick=function(){ keys.forEach(function(k){ delete S.sel[k]; }); save(); render(); };
    w.appendChild(rm);
  }
  return w;
}
function areaList(a){
  var wrap=el('div','pane');
  if(a.id==='mu'){
    REGIONS.forEach(function(r){
      var cs=CARDS.filter(function(c){return c.part===r;});
      wrap.appendChild(el('h3','sec',r+' — '+cs.length));
      wrap.appendChild(bulkRow(cs.map(function(c){return 'm'+c.i;})));
      var ll=el('div','list');
      cs.forEach(function(c){ ll.appendChild(listRow({t:c.lat,s:c.de,k:'m',o:c})); });
      wrap.appendChild(ll);
    });
    return wrap;
  }
  if(a.id==='be'){
    BCATS.forEach(function(cat){
      var bs=BEG.filter(function(b){return b.cat===cat;});
      wrap.appendChild(el('h3','sec',cat+' — '+bs.length));
      wrap.appendChild(bulkRow(bs.map(function(b){return 'b'+b.i;})));
      var ll=el('div','list');
      bs.forEach(function(b){ ll.appendChild(listRow({t:b.k,s:trim(b.v,70),k:'b',o:b})); });
      wrap.appendChild(ll);
    });
    return wrap;
  }
  wrap.appendChild(el('h3','sec',a.t));
  var l=el('div','list'), items=[];
  if(a.id==='fg') items=D.funk.map(function(g){return {t:g.g+' · '+g.b,s:g.m.length+' Muskeln',k:'fg',o:g};});
  if(a.id==='gr') items=D.gruppen.map(function(g){return {t:g.n,s:(g.reg?g.reg+' — ':'')+trim(g.t,70),k:'gr',o:g};});
  if(a.id==='sa') items=D.sammel.map(function(g){return {t:g.n,s:trim(g.b,70),k:'sa',o:g};});
  if(a.id==='tr') items=D.trakte.map(function(g){return {t:g.n,s:trim(g.t,70),k:'tr',o:g};});
  if(a.id==='ke') items=D.kenn.map(function(g){return {t:g.s,s:g.n,k:'ke',o:g};});
  if(a.id==='dy') items=D.dys.map(function(g){return {t:g.n,s:trim(g.f,80),k:'dy',o:g};});
  if(a.id==='me') items=D.mehr.map(function(g){return {t:g.n,s:g.g,k:'me',o:g};});
  if(a.id==='ge') items=D.gelenke.map(function(g){return {t:g.n,s:g.t,k:'ge',o:g};});
  if(a.id==='fa') items=D.faszien.map(function(g){return {t:g.n,s:trim(g.l,80),k:'fa',o:g};});
  if(a.id==='ra') items=D.raeume.map(function(g){return {t:g.n,s:trim(g.b,80),k:'ra',o:g};});
  items.forEach(function(x){ l.appendChild(listRow(x)); });
  wrap.appendChild(l);
  return wrap;
}

/* ---------- Stand ---------- */
function renderSubStand(){ $('#subbar').textContent=''; }
function renderStand(){
  var main=$('#main'), bar=$('#bar');
  main.textContent=''; bar.textContent='';
  var pane=el('div','pane'); main.appendChild(pane);

  if(S.day!==today()) { S.day=today(); S.today=0; save(); }
  var g=el('div','goal');
  var r1=el('div','row');
  r1.appendChild(el('div','big',S.today+' von '+S.goal+' heute'));
  r1.appendChild(el('div','streak',S.streak>0?(S.streak+' Tage in Folge'):'noch keine Serie'));
  g.appendChild(r1);
  var m=el('div','meter'); var f=el('i'); f.style.width=Math.min(100,Math.round(100*S.today/S.goal))+'%';
  m.appendChild(f); g.appendChild(m);
  var r2=el('div','row'); r2.style.marginTop='10px';
  r2.appendChild(el('div','note','Tagesziel'));
  var sel=el('div'); sel.style.display='flex'; sel.style.gap='6px';
  [10,20,30,50].forEach(function(n){
    var b=el('button','chip',String(n)); b.type='button';
    b.setAttribute('aria-pressed',String(S.goal===n));
    b.onclick=function(){ S.goal=n; save(); render(); };
    sel.appendChild(b);
  });
  r2.appendChild(sel); g.appendChild(r2);
  pane.appendChild(g);

  pane.appendChild(el('h3','sec','Muskeln'));
  pane.appendChild(tiles('m',CARDS));
  pane.appendChild(regMeter());
  pane.appendChild(el('h3','sec','Begriffe'));
  pane.appendChild(tiles('b',BEG));
  pane.appendChild(catMeter());

  if(selCount()){
    var ls=el('div','list');
    var bs=el('button','li'); bs.type='button';
    bs.appendChild(el('div','t','Meine Auswahl: '+selCount('m')+' Muskeln, '+selCount('b')+' Begriffe'));
    bs.appendChild(el('div','s','Als Kartenfilter und als Quizmodus verfügbar'));
    bs.onclick=function(){ tab='quiz'; qscope='mix'; S.region='Auswahl'; S.bcat='Auswahl'; save(); q=null; setTab(); render(); };
    ls.appendChild(bs);
    var bc=el('button','li'); bc.type='button';
    bc.appendChild(el('div','t','Auswahl leeren'));
    bc.appendChild(el('div','s','Der Lernstand bleibt erhalten'));
    bc.onclick=function(){ S.sel={}; if(S.region==='Auswahl')S.region='Alle';
      if(S.bcat==='Auswahl')S.bcat='Alle'; save(); buildQueue(); render(); };
    ls.appendChild(bc);
    pane.appendChild(ls);
  }
  if(errCount()){
    var l=el('div','list');
    var b=el('button','li'); b.type='button';
    b.appendChild(el('div','t','Fehlerkiste: '+errCount()+' Karten'));
    b.appendChild(el('div','s','Gezielt wiederholen — auch als Quizmodus'));
    b.onclick=function(){ tab='quiz'; qscope='mix'; S.region='Fehler'; S.bcat='Fehler'; save(); q=null; setTab(); render(); };
    l.appendChild(b); pane.appendChild(l);
  }
  pane.appendChild(el('div','note','Eine Karte steigt eine Stufe, wenn du sie kannst, und fällt bei „Nochmal" oder einer falschen Quizantwort auf Stufe 1 zurück und landet in der Fehlerkiste. Ab Stufe 4 gilt sie als gelernt. Der Stand liegt nur auf diesem Gerät.'));
  bar.appendChild(mkBtn('Fortschritt zurücksetzen','ghost',function(){
    S.box={};S.err={};S.right=0;S.wrong=0;S.today=0;S.streak=0;S.lastDone='';
    save();buildQueue();render();
  }));
}
function tiles(pr,arr){
  var s=0,o=0;
  arr.forEach(function(x){ var k=pr+x.i; if(lvl(k)>=4)s++; else if(S.box[k])o++; });
  var t=el('div','tiles');
  [[s,'sitzt'],[o,'in Arbeit'],[arr.length-s-o,'neu']].forEach(function(p){
    var d=el('div','tile'); d.appendChild(el('div','n',String(p[0]))); d.appendChild(el('div','l',p[1])); t.appendChild(d);
  });
  return t;
}
function meterList(groups){
  var box=el('div','reg');
  groups.forEach(function(g){
    var done=g.items.filter(function(x){return lvl(g.pre+x.i)>=4;}).length;
    var row=el('div','regrow'), nm=el('div');
    nm.appendChild(el('div',null,g.name));
    var m=el('div','meter'), f=el('i');
    f.style.width=Math.round(100*done/g.items.length)+'%'; m.appendChild(f); nm.appendChild(m);
    row.appendChild(nm); row.appendChild(el('div','pct',done+'/'+g.items.length));
    box.appendChild(row);
  });
  return box;
}
function regMeter(){
  return meterList(REGIONS.map(function(r){
    return {name:r,pre:'m',items:CARDS.filter(function(c){return c.part===r;})};
  }));
}
function catMeter(){
  return meterList(BCATS.map(function(r){
    return {name:r,pre:'b',items:BEG.filter(function(b){return b.cat===r;})};
  }));
}

/* ---------- shell ---------- */
function updateCount(){
  var p=mpoolAll();
  var done=p.filter(function(c){return lvl('m'+c.i)>=4;}).length;
  var bd=BEG.filter(function(b){return lvl('b'+b.i)>=4;}).length;
  var sc=selCount();
  $('#count').textContent=done+'/'+p.length+' Muskeln · '+bd+'/'+BEG.length+' Begriffe'+(sc?' · ★ '+sc:'');
}
function setTab(){
  ['karten','quiz','wissen','stand'].forEach(function(m){
    $('#t-'+m).setAttribute('aria-selected',String(tab===m));
  });
}
function render(){
  updateCount();
  if(tab==='karten'){ renderSubKarten(); renderKarten(); }
  else if(tab==='quiz'){ renderSubQuiz(); renderQuiz(); }
  else if(tab==='wissen'){ renderSubWissen(); renderWissen(); }
  else { renderSubStand(); renderStand(); }
}
['karten','quiz','wissen','stand'].forEach(function(m){
  $('#t-'+m).onclick=function(){
    tab=m; if(m==='wissen') wpath=[];
    setTab(); render(); top0();
  };
});
buildQueue(); setTab(); render();
})();
</script>

if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
